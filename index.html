<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00695C">
<title>أسناني — My teeth</title>
<meta name="application-name" content="أسناني">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="أسناني">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/*═══════════════════════════════════════════════════════════
  DentalOS — نظام تصميم زجاجي (Glass)
  الأسطح شبه شفافة فوق خلفية متدرّجة ثابتة.
  التمويه مقصور على الأسطح الكبيرة فقط حتى لا يثقل الجهاز.
═══════════════════════════════════════════════════════════*/
:root{
  --bg:#E8EFF1;
  --blob1:#7FD8CB; --blob2:#9CC8F0; --blob3:#F2D3B8;

  --glass:rgba(255,255,255,.62);
  --glass2:rgba(255,255,255,.44);
  --glassS:rgba(255,255,255,.78);
  --stroke:rgba(255,255,255,.75);
  --edge:rgba(10,50,58,.10);

  --ink:#06232B; --ink2:#31555F; --ink3:#5D7F89;

  --br:#00736A; --br2:#00A594; --brL:rgba(0,115,106,.13);
  --on-br:#FFFFFF;

  --ok:#12784A; --okL:rgba(18,120,74,.14);
  --wr:#9A6400; --wrL:rgba(154,100,0,.15);
  --bd:#B23A2C; --bdL:rgba(178,58,44,.14);
  --info:#0B5FA0; --infoL:rgba(11,95,160,.13);

  --gum:#EFC2CA; --tooth:#FFFFFF; --tline:#9DB4B8;

  --sh:0 1px 1px rgba(6,35,43,.04), 0 8px 24px -14px rgba(6,35,43,.30);
  --shL:0 2px 6px rgba(6,35,43,.06), 0 24px 50px -26px rgba(6,35,43,.45);
  --r:18px; --blur:blur(18px) saturate(150%);
}
html[data-theme=dark]{
  --bg:#050D10;
  --blob1:#065A55; --blob2:#0A3352; --blob3:#3A2418;

  --glass:rgba(20,38,42,.62);
  --glass2:rgba(20,38,42,.42);
  --glassS:rgba(24,44,49,.86);
  --stroke:rgba(255,255,255,.10);
  --edge:rgba(255,255,255,.07);

  --ink:#E9F5F3; --ink2:#A8C6C2; --ink3:#7C9C98;

  --br:#12C9AE; --br2:#3FE8CE; --brL:rgba(18,201,174,.16);
  --on-br:#03211D;

  --ok:#3FD489; --okL:rgba(63,212,137,.15);
  --wr:#E2AE47; --wrL:rgba(226,174,71,.15);
  --bd:#F2705F; --bdL:rgba(242,112,95,.15);
  --info:#55AFF5; --infoL:rgba(85,175,245,.15);

  --gum:#3B2028; --tooth:#DCEAE8; --tline:#06232B;

  --sh:0 1px 1px rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8);
  --shL:0 24px 60px -30px rgba(0,0,0,.95);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  font-size:15px;line-height:1.6;font-weight:500;
  -webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;
}
/* الخلفية: ثلاث هالات لونية ثابتة — تعطي العمق الزجاجي بلا أي رسم متحرك */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48vw 42vw at 12% 8%,  var(--blob1), transparent 62%),
    radial-gradient(52vw 46vw at 88% 22%, var(--blob2), transparent 64%),
    radial-gradient(46vw 40vw at 50% 96%, var(--blob3), transparent 62%);
  opacity:.55;
}
html[data-theme=dark] body::before{opacity:.42}

.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.dsp{font-family:'Zain','IBM Plex Sans Arabic',sans-serif;font-weight:800}

/*──────── الأسطح الزجاجية ────────*/
.card{
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid var(--stroke);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh);
}
.card+.card{margin-top:12px}
.card.flat{background:var(--glass2);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}

/*──────── إدخال ────────*/
input,select,textarea{
  width:100%;padding:12px 14px;border-radius:13px;font:inherit;font-weight:500;
  border:1px solid var(--edge);background:var(--glassS);color:var(--ink);
  outline:none;transition:border-color .16s,box-shadow .16s,background .16s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--br);box-shadow:0 0 0 4px var(--brL);
}
input.err,select.err,textarea.err{border-color:var(--bd);background:var(--bdL)}
input::placeholder,textarea::placeholder{color:var(--ink3);font-weight:500}
textarea{min-height:84px;resize:vertical}
select{cursor:pointer}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px}
label.lb .req{color:var(--bd);font-weight:800}
input[type=color]{padding:3px;cursor:pointer}
input[type=file]{padding:9px;font-size:13px}

/*──────── أزرار ────────*/
button{font:inherit;font-weight:700;cursor:pointer;border:none;background:none;color:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 20px;border-radius:14px;font-size:14.5px;font-weight:700;
  background:linear-gradient(180deg,var(--br2),var(--br));color:var(--on-br);
  box-shadow:0 1px 1px rgba(0,0,0,.05),0 8px 20px -12px var(--br);
  transition:transform .13s,filter .16s,box-shadow .16s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.w{width:100%}
.btn.gh{background:var(--glassS);color:var(--ink2);border:1px solid var(--edge);box-shadow:none;
        -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.gh:hover{border-color:var(--br);color:var(--br)}
.btn.sf{background:var(--brL);color:var(--br);box-shadow:none}
.btn.dg{background:linear-gradient(180deg,#e0685a,var(--bd));color:#fff;box-shadow:0 8px 20px -12px var(--bd)}
.btn.ok{background:linear-gradient(180deg,#2fa96e,var(--ok));color:#fff;box-shadow:0 8px 20px -12px var(--ok)}
.btn.wn{background:linear-gradient(180deg,#d0a04a,var(--wr));color:#fff;box-shadow:0 8px 20px -12px var(--wr)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn.xs{padding:5px 11px;font-size:12px;border-radius:10px}
.ib{width:40px;height:40px;border-radius:13px;flex-shrink:0;
    border:1px solid var(--edge);background:var(--glassS);color:var(--ink2);
    display:grid;place-items:center;font-size:15px;font-weight:700;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    transition:border-color .16s,color .16s,transform .13s}
.ib:hover{border-color:var(--br);color:var(--br)}
.ib:active{transform:scale(.94)}

/*──────── تخطيط ────────*/
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:9px}
.gr{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wrapv{flex-wrap:wrap}
.mt{margin-top:12px}.mt2{margin-top:20px}.mt3{margin-top:28px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr{text-align:center}
.hide{display:none!important}
.sep{height:1px;background:var(--edge);margin:16px 0}

.h1{font-family:'Zain',sans-serif;font-weight:800;font-size:27px;line-height:1.2}
.h2{font-family:'Zain',sans-serif;font-weight:800;font-size:22px;line-height:1.25}
.h3{font-size:15.5px;font-weight:700}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
     letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.sub{font-size:13px;color:var(--ink2);font-weight:500}
.tiny{font-size:12px;color:var(--ink3)}

/*──────── شارات ────────*/
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
      font-size:12px;font-weight:700;white-space:nowrap}
.pill.b{background:var(--brL);color:var(--br)}
.pill.g{background:var(--okL);color:var(--ok)}
.pill.w{background:var(--wrL);color:var(--wr)}
.pill.r{background:var(--bdL);color:var(--bd)}
.pill.i{background:var(--infoL);color:var(--info)}
.pill.n{border:1px solid var(--edge);color:var(--ink2);background:var(--glass2)}

/*──────── تنبيهات ────────*/
.al{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;
    font-size:13.5px;font-weight:700;line-height:1.55;border:1px solid transparent}
.al.r{background:var(--bdL);color:var(--bd);border-color:var(--bd)}
.al.w{background:var(--wrL);color:var(--wr);border-color:var(--wr)}
.al.g{background:var(--okL);color:var(--ok);border-color:var(--ok)}
.al.i{background:var(--infoL);color:var(--info);border-color:var(--info)}

/*──────── عناصر القوائم ────────*/
.it{display:flex;align-items:center;gap:12px;padding:13px 14px;
    background:var(--glass);border:1px solid var(--stroke);border-radius:15px;
    cursor:pointer;box-shadow:var(--sh);
    transition:transform .14s,border-color .16s,box-shadow .16s}
.it:hover{border-color:var(--br);box-shadow:var(--shL)}
.it:active{transform:scale(.99)}
/* الضغط المطوّل: العنصر ينكمش ويتلوّن بلون التحذير قبل فتح الخيارات */
.it.holding{transform:scale(.965);border-color:var(--bd);box-shadow:0 0 0 3px var(--bdL)}
/* مسار الأشرطة في الإحصائيات */
.track{height:10px;border-radius:99px;background:var(--glass2);
       border:1px solid var(--edge);overflow:hidden}
.track>i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.3,.9,.3,1)}
.rk{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
    font-family:'Zain',sans-serif;font-size:13px;font-weight:800;
    background:var(--glass2);color:var(--ink2);border:1px solid var(--edge)}
.rk.top{background:var(--wrL);color:var(--wr);border-color:transparent}
.av{width:42px;height:42px;border-radius:14px;flex-shrink:0;background:var(--brL);
    color:var(--br);display:grid;place-items:center;font-family:'Zain',sans-serif;
    font-size:18px;font-weight:800}
.av.r{background:var(--bdL);color:var(--bd)}
.av.w{background:var(--wrL);color:var(--wr)}
.av.g{background:var(--okL);color:var(--ok)}

/*──────── مربع اختيار ────────*/
.chk{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;
     border:1px solid var(--edge);background:var(--glass2);cursor:pointer;
     font-size:14px;font-weight:600;line-height:1.45;transition:all .16s}
.chk .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink3);
         flex-shrink:0;display:grid;place-items:center;font-size:15px;
         color:transparent;font-weight:900;transition:all .16s}
.chk.on{border-color:var(--br);background:var(--brL)}
.chk.on .bx{background:var(--br);border-color:var(--br);color:var(--on-br)}
.chk.on.dang{border-color:var(--bd);background:var(--bdL)}
.chk.on.dang .bx{background:var(--bd);border-color:var(--bd);color:#fff}

/*──────── مقاطع ────────*/
.segs{display:flex;gap:4px;padding:4px;background:var(--glass2);
      border:1px solid var(--edge);border-radius:14px}
.segs button{flex:1;padding:10px 6px;border-radius:11px;font-size:13.5px;
             font-weight:700;color:var(--ink2);transition:all .2s}
.segs button.on{background:var(--glassS);color:var(--br);box-shadow:var(--sh)}

/*═══════════ الهيكل: قائمة جانبية ═══════════*/
.shell{display:flex;min-height:100vh}

.side{
  width:250px;flex-shrink:0;position:sticky;top:0;height:100vh;
  padding:18px 14px;display:flex;flex-direction:column;gap:6px;
  background:var(--glass);border-inline-end:1px solid var(--stroke);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  z-index:50;transition:transform .28s cubic-bezier(.3,.9,.3,1);
}
.side .brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px}
.side .brand .mk{width:40px;height:40px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(180deg,var(--br2),var(--br));display:grid;place-items:center;
  box-shadow:0 8px 20px -12px var(--br)}
.navb{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:14px;
      font-size:14.5px;font-weight:700;color:var(--ink2);width:100%;text-align:start;
      position:relative;transition:background .18s,color .18s,transform .14s}
.navb:hover{background:var(--glass2);color:var(--ink)}
.navb.on{background:var(--brL);color:var(--br)}
.navb.on::before{content:'';position:absolute;inset-inline-start:0;top:22%;bottom:22%;
  width:3px;border-radius:99px;background:var(--br)}
.navb:active{transform:scale(.985)}
.navb svg{width:20px;height:20px;flex-shrink:0}
.navb .cnt{margin-inline-start:auto;min-width:20px;height:20px;border-radius:99px;
  background:var(--bd);color:#fff;font-size:11px;font-weight:800;
  display:grid;place-items:center;padding:0 6px;font-family:'IBM Plex Mono',monospace}
.side .foot{margin-top:auto;display:flex;gap:7px;padding-top:12px;border-top:1px solid var(--edge)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
        padding:12px 16px;background:var(--glass);border-bottom:1px solid var(--stroke);
        -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:16px 16px 60px}
.burger{display:none}
.scrim{position:fixed;inset:0;background:rgba(3,16,19,.45);z-index:45;
       backdrop-filter:blur(2px);animation:fade .2s}

@media (min-width:1500px){ .wrap{max-width:1240px} }

/* الهاتف واللوحي: القائمة تنزلق */
@media (max-width:899px){
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;
        transform:translateX(var(--sx,-110%));box-shadow:var(--shL)}
  html[dir=rtl] .side{--sx:110%}
  body.nav-open .side{--sx:0 !important;transform:translateX(0)}
  .burger{display:grid}
  .wrap{padding:14px 14px 50px}
  .topbar{padding:10px 12px}
}

/*──────── صفحة مستقلة ────────*/
.shb{position:fixed;inset:0;z-index:70;background:var(--bg);
     overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .18s ease}
.shb::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48vw 42vw at 12% 8%,  var(--blob1), transparent 62%),
    radial-gradient(52vw 46vw at 88% 22%, var(--blob2), transparent 64%),
    radial-gradient(46vw 40vw at 50% 96%, var(--blob3), transparent 62%);
  opacity:.55}
html[data-theme=dark] .shb::before{opacity:.42}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh{width:100%;max-width:960px;margin:0 auto;min-height:100%;
    padding:14px 15px 46px;animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(12px);opacity:.5}to{transform:translateY(0);opacity:1}}
.grab{display:none}
@media (min-width:900px){ .sh{padding:24px 30px 56px} }

.shhead{display:flex;align-items:flex-start;gap:10px;position:sticky;top:0;z-index:5;
        padding:12px 14px;margin:0 0 14px;border-radius:16px;
        background:var(--glass);border:1px solid var(--stroke);
        -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
        box-shadow:var(--sh)}

/*──────── اقتراحات ────────*/
.sgw{position:relative}
.sgs{position:absolute;top:100%;inset-inline:0;margin-top:6px;z-index:50;
     background:var(--glassS);border:1px solid var(--br);border-radius:13px;
     overflow:hidden;box-shadow:var(--shL);
     -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sgs div{padding:11px 13px;font-size:14px;font-weight:600;cursor:pointer}
.sgs div+div{border-top:1px solid var(--edge)}
.sgs div:hover{background:var(--brL)}

/*──────── مخطط الأسنان ────────*/
.chart{width:100%;display:block;touch-action:manipulation;max-width:560px;margin:0 auto}
.chart g{cursor:pointer;transition:opacity .15s}
.chart g:hover{opacity:.78}
.lgd{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lgd span{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
          color:var(--ink2);padding:4px 9px;border-radius:99px;
          background:var(--glass2);border:1px solid var(--edge)}
.lgd i{width:10px;height:10px;border-radius:3px;display:inline-block}

/*──────── خط زمني ────────*/
.tl{display:flex;gap:13px}
.tl .dot{width:11px;height:11px;border-radius:99px;background:var(--ink3);
         margin-top:6px;flex-shrink:0}
.tl .dot.on{background:var(--br);box-shadow:0 0 0 4px var(--brL)}
.tl .bar{width:2px;flex:1;background:var(--edge);margin-top:3px}
.tl .cl{display:flex;flex-direction:column;align-items:center}

/*──────── جدول ────────*/
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:start;padding:10px 8px;font-size:11.5px;font-weight:700;
        color:var(--ink2);border-bottom:1px solid var(--edge)}
.tbl td{padding:11px 8px;border-bottom:1px solid var(--edge);font-weight:600}
.tbl tr:last-child td{border-bottom:none}

/*──────── فارغ / تحميل ────────*/
.emp{padding:44px 18px;text-align:center;font-size:14px;font-weight:600;
     color:var(--ink3);border:1px dashed var(--ink3);border-radius:17px;
     background:var(--glass2)}
.spin{width:26px;height:26px;border:3px solid var(--edge);border-top-color:var(--br);
      border-radius:99px;animation:sp .7s linear infinite;margin:34px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/*──────── إشعار ────────*/
#toast{position:fixed;inset-inline:0;bottom:26px;z-index:95;display:flex;
       justify-content:center;pointer-events:none;padding:0 16px}
#toast>div{padding:13px 22px;border-radius:15px;font-size:14px;font-weight:700;
           max-width:460px;box-shadow:var(--shL);animation:up .25s;
           background:var(--glassS);color:var(--ink);border:1px solid var(--stroke);
           -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#toast>div.e{background:var(--bd);color:#fff;border-color:transparent}
#toast>div.s{background:var(--ok);color:#fff;border-color:transparent}

/*──────── دخول ────────*/
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.logo{width:70px;height:70px;border-radius:23px;
      background:linear-gradient(180deg,var(--br2),var(--br));
      display:grid;place-items:center;margin:0 auto 18px;
      box-shadow:0 18px 40px -18px var(--br)}
.rolebtn{display:flex;align-items:center;gap:13px;padding:15px;border-radius:17px;
         border:1px solid var(--stroke);background:var(--glass);width:100%;text-align:start;
         box-shadow:var(--sh);
         -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
         transition:transform .14s,border-color .16s,box-shadow .16s}
.rolebtn:hover{border-color:var(--br);box-shadow:var(--shL)}
.rolebtn:active{transform:scale(.99)}
.rolebtn .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}

/*──────── قوائم الإعدادات ────────*/
details.acc{background:var(--glass);border:1px solid var(--stroke);border-radius:17px;
            overflow:hidden;margin-top:11px;box-shadow:var(--sh);
            -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
details.acc>summary{padding:15px 16px;cursor:pointer;font-weight:700;font-size:15px;
  list-style:none;display:flex;align-items:center;gap:11px;user-select:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .ar{margin-inline-start:auto;color:var(--ink3);transition:transform .22s}
details.acc[open]>summary{border-bottom:1px solid var(--edge)}
details.acc[open]>summary .ar{transform:rotate(90deg)}
details.acc .bd{padding:16px}
.accic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
       background:var(--brL);color:var(--br);font-size:16px;flex-shrink:0}

/*──────── مفتاح ────────*/
.sw{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;
    border:1px solid var(--edge);background:var(--glass2);cursor:pointer;transition:all .18s}
.sw.on{border-color:var(--br);background:var(--brL)}
.sw .tg{width:52px;height:30px;border-radius:99px;background:var(--ink3);
        position:relative;flex-shrink:0;transition:background .22s}
.sw .tg::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;
  border-radius:99px;background:#fff;transition:transform .24s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw.on .tg{background:var(--br)}
html[dir=rtl] .sw.on .tg::after{transform:translateX(-22px)}
html[dir=ltr] .sw.on .tg::after{transform:translateX(22px)}

/*──────── وميض الاستدعاء ────────*/
@keyframes blink{
  0%,100%{box-shadow:var(--sh),0 0 0 0 var(--brL);border-color:var(--br)}
  50%{box-shadow:var(--sh),0 0 0 8px transparent;border-color:var(--br2)}
}
.it.live{animation:blink 1.7s ease-in-out infinite;border-color:var(--br)}
.dotlive{width:9px;height:9px;border-radius:99px;background:var(--br);
         display:inline-block;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}

/*──────── شريط بحث ────────*/
.sbar{display:flex;gap:9px;align-items:center}
.sbar input{flex:1}

/*──────── شعار التطبيق ────────*/
.applogo{width:96px;height:96px;border-radius:26px;margin:0 auto 16px;display:block;
  box-shadow:0 20px 44px -18px rgba(0,105,92,.7)}
.applogo.sm{width:52px;height:52px;border-radius:15px;margin:0;box-shadow:var(--sh)}

/*──────── بطاقة التثبيت ────────*/
#instbar{position:fixed;z-index:88;inset-inline:0;bottom:0;display:flex;
  justify-content:center;padding:14px;pointer-events:none;
  animation:instUp .38s cubic-bezier(.2,.9,.3,1)}
@keyframes instUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
#instbar .box{pointer-events:auto;width:100%;max-width:430px;display:flex;align-items:center;
  gap:13px;padding:13px 14px;border-radius:20px;
  background:var(--glassS);border:1px solid var(--stroke);box-shadow:var(--shL);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
#instbar .nm{font-family:'Zain',sans-serif;font-weight:800;font-size:17px;line-height:1.15}
#instbar .ds{font-size:12px;color:var(--ink2);font-weight:600;margin-top:1px}
#instbar .x{width:30px;height:30px;border-radius:10px;flex-shrink:0;color:var(--ink3);
  display:grid;place-items:center;font-size:15px}
/* على الحاسبة تظهر في الزاوية بدل منتصف الأسفل */
@media (min-width:900px){
  #instbar{inset-inline-start:auto;inset-inline-end:0;bottom:0;padding:22px;justify-content:flex-end}
  #instbar .box{max-width:400px}
}
@media (display-mode:standalone){ #instbar{display:none} }

/*──────── معاينة ورقة A5 داخل البرنامج ────────*/
.paper{background:#fff;color:#111;border-radius:14px;padding:18px 16px;
       box-shadow:var(--shL);border:1px solid rgba(0,0,0,.08);
       font-family:'IBM Plex Sans Arabic',sans-serif}
.paper .phd{text-align:center;border-bottom:3px solid #00695C;padding-bottom:8px}
.paper .phd img{width:100%;max-height:110px;object-fit:contain;display:block}
.paper .pmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-size:12.5px;margin:11px 0;padding:8px 0;border-bottom:1px dashed #999;color:#222}
/* السطر كله من اليسار: الرقم يسار الدواء كما في الوصفات الطبية */
.paper .rxrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #ddd;
  direction:ltr;text-align:left}
.paper .rxrow .n{width:24px;font-weight:800;color:#00695C;flex-shrink:0;
  font-family:'IBM Plex Mono',monospace}
.paper .rxtxt{flex:1;min-width:0}
.paper .dname{font-size:14.5px;font-weight:800;color:#111}
/* التفاصيل مختلطة عربي/أرقام — يُترك لكل جزء اتجاهه الطبيعي */
.paper .ddose{font-size:11.5px;color:#444;margin-top:2px;unicode-bidi:plaintext}
.paper .pft{margin-top:16px;padding-top:8px;border-top:1px solid #ddd;
  text-align:center;font-size:11px;color:#555}
.paper .psig{margin-top:24px;text-align:center;font-size:12px;color:#222}
.paper .psig img{display:block;margin:0 auto -6px;max-height:64px;max-width:210px;object-fit:contain}
.paper .psig .pname{font-weight:800;font-size:13px;border-top:1px solid #444;
  display:inline-block;padding-top:5px;min-width:190px}

/*──────── الكاميرا ────────*/
.camwrap{position:relative;border-radius:18px;overflow:hidden;background:#000;
         aspect-ratio:4/3;max-height:58vh}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camaim{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.camaim .box{width:78%;height:34%;border:3px solid rgba(255,255,255,.95);
             border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.camaim .ln{position:absolute;width:78%;height:3px;background:var(--br2);
            box-shadow:0 0 12px var(--br2);animation:sweep 1.9s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-17%)}50%{transform:translateY(17%)}}
.camst{position:absolute;inset-inline:0;bottom:0;padding:10px;text-align:center;
       background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;
       font-size:13px;font-weight:700}

/*──────── تقليل الحركة عند الطلب ────────*/
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/*──────── طباعة ────────*/
@media print{
  body{background:#fff;color:#000}
  body::before{display:none}
  .noprint,.side,.topbar,#toast{display:none!important}
  @page{size:A5;margin:9mm}
}

/*═══════════════ التخزين — IndexedDB ═══════════════*/
/* بعض السياقات تمنع IndexedDB: فتح الملف من مدير ملفات أندرويد
   (content://) أو التصفّح الخاص. عندها ننتقل تلقائياً إلى تخزين
   بديل يحفظ في localStorage، ولو مُنع هذا أيضاً نعمل في الذاكرة
   مع تحذير صريح بأن البيانات لن تبقى بعد إغلاق الصفحة. */
const MEM = {
  data:{}, mode:'memory',

  init(stores){
    stores.forEach(s => this.data[s] = this.data[s] || {});
    try {
      const raw = localStorage.getItem('dentalos_fallback');
      if (raw) Object.assign(this.data, JSON.parse(raw));
      localStorage.setItem('dentalos_probe','1');
      localStorage.removeItem('dentalos_probe');
      this.mode = 'local';
    } catch { this.mode = 'memory'; }
  },

  flush(){
    if (this.mode !== 'local') return;
    try { localStorage.setItem('dentalos_fallback', JSON.stringify(this.data)); }
    catch { /* الحصة ممتلئة — الصور الكبيرة قد تتجاوزها */ }
  },

  put(st, o){ (this.data[st] ||= {})[o.id] = o; this.flush(); return o; },
  get(st, id){ return (this.data[st]||{})[id] || null; },
  all(st){ return Object.values(this.data[st]||{}); },
  by(st, idx, v){ return this.all(st).filter(x => x[idx] === v); },
  del(st, id){ delete (this.data[st]||{})[id]; this.flush(); },
  clearAll(){ for (const k of Object.keys(this.data)) this.data[k] = {}; this.flush(); },
};

const DB = {
  _db:null, fallback:false,
  STORES:['patients','visits','works','payments','rx','files','settings','users','bookings','suggest','tooth','appts'],

  async open(){
    if (this.fallback) return null;
    if (this._db) return this._db;
    try {
      this._db = await this._openIDB();
    } catch (e) {
      /* المنع متوقّع في content:// — ننتقل للبديل بدل تعطيل البرنامج */
      this.fallback = true;
      MEM.init(this.STORES);
      throw Object.assign(new Error('STORAGE_FALLBACK'), { cause:e });
    }
    return this._db;
  },

  async _openIDB(){
    return await new Promise((res,rej)=>{
      const r = indexedDB.open('dentalos', 4);
      /* تبويب قديم مفتوح يمنع ترقية قاعدة البيانات فتتجمّد بصمت.
         هنا نُعلم المستخدم بدل أن يبقى الزر بلا استجابة. */
      r.onblocked = () => rej(new Error(
        'أغلق نسخ البرنامج المفتوحة في التبويبات الأخرى ثم أعد التحميل'));
      setTimeout(() => rej(new Error('تعذّر فتح قاعدة البيانات — أعد تحميل الصفحة')), 8000);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        for (const s of DB.STORES){
          if (!db.objectStoreNames.contains(s)){
            const os = db.createObjectStore(s, { keyPath:'id' });
            if (['visits','works','payments','rx','files','tooth','appts'].includes(s))
              os.createIndex('pid','pid',{unique:false});
            if (s==='works'||s==='rx'||s==='files') os.createIndex('vid','vid',{unique:false});
            if (s==='visits') os.createIndex('code','code',{unique:false});
          }
        }
      };
      r.onsuccess = e => res(e.target.result);
      r.onerror  = e => rej(e.target.error);
    });
  },

  async tx(store, mode='readonly'){
    const db = await this.open();
    return db.transaction(store, mode).objectStore(store);
  },

  async put(store, obj){
    if (this.fallback) return MEM.put(store, obj);
    const os = await this.tx(store,'readwrite');
    return new Promise((res,rej)=>{ const r=os.put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); });
  },
  async get(store, id){
    if (this.fallback) return MEM.get(store, id);
    const os = await this.tx(store);
    return new Promise((res,rej)=>{ const r=os.get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  },
  async all(store){
    if (this.fallback) return MEM.all(store);
    const os = await this.tx(store);
    return new Promise((res,rej)=>{ const r=os.getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
  },
  async by(store, index, val){
    if (this.fallback) return MEM.by(store, index, val);
    const os = await this.tx(store);
    return new Promise((res,rej)=>{
      const r = os.index(index).getAll(val);
      r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
    });
  },
  async del(store, id){
    if (this.fallback) return MEM.del(store, id);
    const os = await this.tx(store,'readwrite');
    return new Promise((res,rej)=>{ const r=os.delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
  },
  async clearAll(){
    if (this.fallback) return MEM.clearAll();
    const db = await this.open();
    const tx = db.transaction(DB.STORES,'readwrite');
    DB.STORES.forEach(s=>tx.objectStore(s).clear());
    return new Promise(res=>{ tx.oncomplete=res; });
  },
};

const ALPH='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function newCode(){
  let s='V'; const a=crypto.getRandomValues(new Uint8Array(11));
  for(const b of a) s+=ALPH[b%ALPH.length];

}

/*═══ الحقول الذكية: تتعلم من كل إدخال ═══*/
const SG = {
  async learn(field, val){
    const v = String(val||'').trim();
    if (v.length < 2 || v.length > 140) return;
    const id = field+'::'+v;
    const cur = await DB.get('suggest', id);
    await DB.put('suggest', { id, field, v, n:(cur?.n||0)+1, at:Date.now() });
  },
  async find(field, q){
    const all = await DB.all('suggest');
    const s = String(q||'').trim();
    return all.filter(x => x.field===field && (!s || x.v.includes(s)) && x.v!==s)
              .sort((a,b)=> b.n-a.n || b.at-a.at).slice(0,6).map(x=>x.v);
  },
  attach(inp, field){
    if (!inp) return;
    inp.parentElement.classList.add('sgw');
    let box=null, tm=null;
    const close=()=>{ if(box){box.remove(); box=null;} };
    const show=async()=>{
      const items = await SG.find(field, inp.value);
      close(); if(!items.length) return;
      box = el(`<div class="sgs">${items.map(v=>`<div>${esc(v)}</div>`).join('')}</div>`);
      [...box.children].forEach((d,i)=> d.onmousedown = e=>{ e.preventDefault(); inp.value=items[i]; close(); });
      inp.parentElement.appendChild(box);
    };
    inp.addEventListener('focus', show);
    inp.addEventListener('input', ()=>{ clearTimeout(tm); tm=setTimeout(show,160); });
    inp.addEventListener('blur', ()=> setTimeout(close,170));
  },
};

/*═══════════════ الضغط المطوّل ═══════════════
  خيارات إضافية بلا أزرار تزحم القوائم: أي عنصر يحمل data-hold
  يُنفِّذ ما فيه بعد نصف ثانية من الضغط، والضغطة العادية تبقى كما هي.
═══════════════════════════════════════════*/
const Hold = {
  t:null, fired:false, x:0, y:0, el:null, MS:550, SLIP:12,

  init(){
    const clear = () => {
      clearTimeout(this.t); this.t = null;
      if (this.el){ this.el.classList.remove('holding'); this.el = null; }
    };

    document.addEventListener('pointerdown', e => {
      const el = e.target.closest && e.target.closest('[data-hold]');
      if (!el) return;
      /* الضغط على زر داخل العنصر يبقى ضغطة زر */
      if (e.target.closest('button') && e.target.closest('button') !== el) return;
      clear();
      this.fired = false; this.x = e.clientX; this.y = e.clientY;
      this.el = el; el.classList.add('holding');
      this.t = setTimeout(() => {
        const run = el.dataset.hold;
        this.fired = true; clear();
        if (navigator.vibrate) try { navigator.vibrate(30); } catch(_){}
        try { new Function(run)(); }
        catch(err){ toast(String((err && err.message) || err), 'e'); }
      }, this.MS);
    }, true);

    document.addEventListener('pointermove', e => {
      if (!this.t) return;
      if (Math.abs(e.clientX - this.x) > this.SLIP ||
          Math.abs(e.clientY - this.y) > this.SLIP) clear();
    }, true);

    ['pointerup','pointercancel','pointerleave','scroll']
      .forEach(ev => document.addEventListener(ev, clear, true));

    /* الضغطة التي صارت ضغطاً مطوّلاً لا تفتح الصفحة خلفها */
    document.addEventListener('click', e => {
      if (!this.fired) return;
      this.fired = false;
      e.stopPropagation(); e.preventDefault();
    }, true);

    document.addEventListener('contextmenu', e => {
      if (e.target.closest && e.target.closest('[data-hold]')) e.preventDefault();
    });
  },
};

/*═══════════════ مخطط الأسنان ═══════════════*/
const UP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const LO=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const UNIV={}; [[18,17,16,15,14,13,12,11],[21,22,23,24,25,26,27,28],
  [38,37,36,35,34,33,32,31],[41,42,43,44,45,46,47,48]].flat().forEach((f,i)=>UNIV[f]=i+1);

const Chart = {
  lbl(f){
    const nt = CFG.data.notation;
    if (nt==='fdi') return String(f);
    if (nt==='universal') return String(UNIV[f]);
    const q=Math.floor(f/10), p=f%10;
    const sym={1:'⌐',2:'¬',3:'L',4:'J'}[q]||'';
    return (q===1||q===4)? `${p}${sym}` : `${sym}${p}`;
  },

  svg(map, sel){
    const W=360, RX=150, up={cy:32,ry:88}, lo={cy:226,ry:88};
    const pos=(list,arc,isUp)=>list.map((f,i)=>{
      const deg=180+(i/(list.length-1))*180, th=deg*Math.PI/180;
      const x=W/2+RX*Math.cos(th);
      const y=isUp? arc.cy-arc.ry*Math.sin(th) : arc.cy+arc.ry*Math.sin(th);
      const rot=isUp?(deg-270):-(deg-270), p=f%10;
      return {f,x,y,rot, w:p>=6?22:p>=4?17:p===3?15.5:14, h:p>=6?23:p>=4?22:24};
    });
    const gumP=(arc,isUp)=>{ let d='';
      for(let i=0;i<=44;i++){ const th=(180+(i/44)*180)*Math.PI/180;
        const x=W/2+RX*Math.cos(th);
        const y=isUp?arc.cy-arc.ry*Math.sin(th):arc.cy+arc.ry*Math.sin(th);
        d+=`${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`; } return d; };

    const teeth=[...pos(UP,up,true), ...pos(LO,lo,false)];
    const body = teeth.map(t=>{
      const st = map[t.f] || 'sound';
      const col = TS(st).col;
      const gone = st==='extracted'||st==='missing';
      const on = sel===t.f;
      return `<g onclick="Doc.tooth(${t.f})">
        <g transform="translate(${t.x.toFixed(1)} ${t.y.toFixed(1)}) rotate(${t.rot.toFixed(1)})">
          <rect x="${(-t.w/2).toFixed(1)}" y="${(-t.h/2).toFixed(1)}" width="${t.w}" height="${t.h}"
            rx="${(t.w*.3).toFixed(1)}"
            fill="${gone?'transparent':(col||'var(--tooth)')}"
            stroke="${on?'var(--br)':gone?'#D94A3D':(col||'var(--tline)')}"
            stroke-width="${on?3:gone?1.8:1.4}" stroke-dasharray="${gone?'3 2.5':'none'}"/>
          ${gone?`<line x1="${-t.w/2+3}" y1="${-t.h/2+3}" x2="${t.w/2-3}" y2="${t.h/2-3}" stroke="#D94A3D" stroke-width="2"/>
                  <line x1="${t.w/2-3}" y1="${-t.h/2+3}" x2="${-t.w/2+3}" y2="${t.h/2-3}" stroke="#D94A3D" stroke-width="2"/>`:''}
        </g>
        <text x="${t.x.toFixed(1)}" y="${(t.y+3.6).toFixed(1)}" text-anchor="middle"
          font-family="'IBM Plex Mono',monospace" font-size="${t.w>19?9:8.2}" font-weight="600"
          fill="${gone?'#D94A3D':col?'#fff':'var(--ink2)'}"
          style="pointer-events:none;user-select:none">${this.lbl(t.f)}</text>
      </g>`;
    }).join('');

    return `<svg class="chart" viewBox="0 0 360 262">
      <path d="${gumP(up,true)}"  fill="none" stroke="var(--gum)" stroke-width="32" stroke-linecap="round"/>
      <path d="${gumP(lo,false)}" fill="none" stroke="var(--gum)" stroke-width="32" stroke-linecap="round"/>
      <line x1="180" y1="8" x2="180" y2="254" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
      ${body}</svg>`;
  },

  legend(){
    return `<div class="lgd">${Object.entries(TSTAT).filter(([,v])=>v.col)
      .map(([k,v])=>`<span><i style="background:${v.col}"></i>${esc(isAr()?v.ar:v.en)}</span>`).join('')}</div>`;
  },
  switcher(){
    return `<div class="row" style="gap:5px">${['palmer','fdi','universal'].map(m=>
      `<button class="btn xs ${CFG.data.notation===m?'':'gh'}" onclick="Chart.set('${m}')">${m.slice(0,4).toUpperCase()}</button>`).join('')}</div>`;
  },
  async set(m){ CFG.data.notation=m; await CFG.save(); App.draw(); },
};

/*═══ باركود Code39 حقيقي — يُقرأ بأي ماسح ═══*/
const C39 = {
  map:{'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw',
       '5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',
       'A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn',
       'F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn',
       'K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn',
       'P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn',
       'U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn',
       'Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'},
  svg(text, h=64){
    /* النجمة رمز البداية والنهاية في Code39 — بدونها لا يقرأ أي ماسح */
    const s = '*' + String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'') + '*';
    const N=1.1, W=2.9; let x=0, bars='';
    for (const ch of s){
      const pat = this.map[ch]; if(!pat) continue;
      for (let i=0;i<9;i++){
        const w = pat[i]==='w'?W:N;
        if (i%2===0) bars += `<rect x="${x.toFixed(2)}" y="0" width="${w}" height="${h}" fill="#000"/>`;
        x += w;
      }
      x += N;
    }
    return `<svg viewBox="0 0 ${x.toFixed(0)} ${h}" preserveAspectRatio="none"
      style="width:100%;height:${h}px;background:#fff;display:block">${bars}</svg>`;
  },
};

  {r:'pharmacy',  ic:'💊', col:'ok'},

const Login = {
  pick:null,
  draw(){
    $('#lg-tag').textContent = T('tag');
    $$('.lgL').forEach(x=>x.textContent = isAr()?'EN':'ع');
    $('#lg-roles').innerHTML = ROLES.map(x=>`
      <button class="rolebtn" onclick="Login.go('${x.r}')">
        <div class="ic" style="background:var(--${x.col}L);font-size:22px">${x.ic}</div>
        <div class="gr">
          <div class="h3">${T('r_'+x.r)}</div>
          <div class="tiny">${T('r_'+x.r+'_d')}</div>
        </div>
        <div style="color:var(--ink3);font-size:18px">${isAr()?'‹':'›'}</div>
      </button>`).join('');
    $('#lb-user').textContent = T('user');
    $('#lb-pass').textContent = T('pass');
    $('#lg-go').textContent   = T('login');
    $('#lg-hint').textContent = T('hint');
  },
  async go(r){
    this.pick = r;
    /* المراجع يختار العيادة أولاً — تطبيق واحد لكل العيادات */
    if (r === 'patient' && !S.clinic) return this.clinicList();
    $('#lg-roles').classList.add('hide');
    $('#lg-form').classList.remove('hide');
    $('#lg-title').textContent = T('r_'+r);
    $('#lg-user').value = r==='patient' ? '' : r;
    $('#lg-pass').value = '';
    $('#lg-err').classList.add('hide');
    if (r === 'patient'){
      $('#lb-user').textContent = T('phone');
      $('#lg-user').placeholder = '07XX XXX XXXX';
    } else {
      $('#lb-user').textContent = T('user');
    }
    $('#lg-pass').parentElement.classList.toggle('hide', r === 'patient');
    setTimeout(()=>$( r==='patient' ? '#lg-user' : '#lg-pass').focus(), 100);
  },
  back(){
    S.clinic = null; this.cq = '';
    $('#lg-roles').classList.remove('hide');
    $('#lg-form').classList.add('hide');
    this.draw();
  },

  /* دليل العيادات مع بحث باسم الطبيب أو العيادة أو المنطقة */
  cq:'',
  async clinicList(){
    $('#lg-roles').innerHTML = `
      <div class="row" style="margin-bottom:12px">
        <button class="ib" onclick="Login.back()">${isAr()?'→':'←'}</button>
        <div class="gr"><div class="h3">${T('pickClinic')}</div>
          <div class="tiny">${T('r_patient_d')}</div></div>
      </div>
      <div class="sbar" style="margin-bottom:12px">
        <input id="cl-q" placeholder="${T('searchClinic')}" value="${esc(this.cq)}">
      </div>
      <div id="cl-list" class="col"></div>`;

    const inp = $('#cl-q');
    let tm;
    inp.addEventListener('input', ()=>{ this.cq = inp.value;
      clearTimeout(tm); tm = setTimeout(()=>this.clinicRows(), 180); });
    this.clinicRows();
  },

  async clinicRows(){
    const box = $('#cl-list'); if (!box) return;
    let list = await CFG.clinics();
    const q = this.cq.trim().toLowerCase();
    if (q) list = list.filter(c =>
      [c.name, c.doctor, c.area, c.gov, c.country, c.landmark]
        .filter(Boolean).some(x => String(x).toLowerCase().includes(q)));

    box.innerHTML = list.length ? list.map(c=>`
      <button class="rolebtn" style="margin-bottom:9px" onclick="Login.setClinic('${c.id}')">
        <div class="ic" style="background:var(--brL);overflow:hidden">
          ${c.logo?`<img src="${c.logo}" style="width:100%;height:100%;object-fit:cover">`
                  :`<span style="font-size:20px">🏥</span>`}</div>
        <div class="gr" style="min-width:0">
          <div class="h3 ell">${esc(c.doctor || c.name || '—')}</div>
          <div class="tiny ell">${esc(c.name||'')}</div>
          <div class="tiny ell">${[c.area, c.gov, c.country].filter(Boolean).map(esc).join(' · ')}</div>
        </div>
        <div style="color:var(--ink3);font-size:18px">${isAr()?'‹':'›'}</div>
      </button>`).join('')
     : `<div class="emp">${T('noClinics')}</div>`;
  },

  async setClinic(cid){
    const list = await CFG.clinics();
    S.clinic = list.find(c=>c.id===cid) || null;
    this.pick = 'patient';
    $('#lg-roles').classList.add('hide');
    $('#lg-form').classList.remove('hide');
    $('#lg-title').textContent = S.clinic?.name || T('r_patient');
    $('#lb-user').textContent  = T('phone');
    $('#lg-user').value = ''; $('#lg-user').placeholder = '07XX XXX XXXX';
    $('#lg-pass').value = '';
    $('#lg-err').classList.add('hide');
    setTimeout(()=>$('#lg-user').focus(), 100);
  },
  async submit(){
    try { await this._submit(); }
    catch (e){
      const box = $('#lg-err');
      box.textContent = e.message || String(e);
      box.classList.remove('hide');
    }
  },

  async _submit(){
    const u = $('#lg-user').value.trim(), p = $('#lg-pass').value;
    const err = $('#lg-err');

    if (this.pick === 'patient'){
      if (u.replace(/\D/g,'').length < 10){
        err.textContent = T('phone') + ' — ' + T('required');
        err.classList.remove('hide'); return;
      }
      const cid = S.clinic?.id || CFG.data.cid;
      const all = (await DB.all('patients')).filter(x => !x.cid || x.cid === cid);
      const pt = all.find(x => (x.phone||'').replace(/\D/g,'') === u.replace(/\D/g,''));
      S.role='patient'; S.user={ phone:u, pid: pt?.id || null, cid };
      return App.start();
    }

    const users = await DB.all('users');
    const usr = users.find(x => x.id===u && x.pass===p);
    if (!usr){ err.textContent = T('badLogin'); err.classList.remove('hide'); return; }
    S.role = usr.role; S.user = usr;
    App.start();
  },
};

/*═══════════════ تسجيل العيادة عند أول تشغيل ═══════════════
  البيانات هنا هي ما يراه المراجع في دليل العيادات، وهي أساس
  الربط المستقبلي بين العيادات حسب البلد والمحافظة.
═══════════════════════════════════════════════════════════*/
const Reg = {
  needed(){ return !CFG.data.registered; },

  draw(){
    $('#lg-roles').classList.add('hide');
    $('#lg-form').classList.add('hide');
    const host = $('#lg-form').parentElement;
    let box = $('#regbox');
    if (!box){
      box = el('<div id="regbox"></div>');
      host.insertBefore(box, $('#lg-form'));
    }
    const c = CFG.data;
    const f = (id,lb,val,req,extra='') =>
      `<div class="mt"><label class="lb">${lb}${req?' <span class="req">*</span>':''}</label>
       <input id="${id}" value="${esc(val||'')}" ${extra}></div>`;

    box.innerHTML = `
      <div class="card">
        <div class="h2">${T('regTitle')}</div>
        <div class="sub">${T('regSub')}</div>
        ${f('r-clinic', T('clinic'), c.clinic==='عيادة الأسنان'?'':c.clinic, true)}
        ${f('r-doctor', T('doctorName'), c.doctor, true)}
        ${f('r-phone',  T('clinicPhone'), c.phone, true, 'dir="ltr" class="mono" inputmode="tel"')}
        <div class="g2 mt">
          <div><label class="lb">${T('country')} <span class="req">*</span></label>
            <input id="r-country" value="${esc(c.country||'العراق')}"></div>
          <div><label class="lb">${T('gov')} <span class="req">*</span></label>
            <input id="r-gov" value="${esc(c.gov||'')}"></div>
        </div>
        ${f('r-area', T('area'), c.area, true)}
        ${f('r-landmark', T('landmark'), c.landmark, true)}
        <div id="r-err" class="al r mt hide"></div>
        <button class="btn w mt2" onclick="Reg.save()">${T('regSave')}</button>
      </div>`;
  },

  async save(){
    const v = id => ($('#'+id)?.value || '').trim();
    const ids = ['r-clinic','r-doctor','r-phone','r-country','r-gov','r-area','r-landmark'];
    let bad = false;
    for (const id of ids){
      const n = $('#'+id);
      const ok = n && n.value.trim().length >= 2;
      n?.classList.toggle('err', !ok);
      if (!ok) bad = true;
    }
    if (bad){
      const e = $('#r-err'); e.textContent = T('fillAll'); e.classList.remove('hide'); return;
    }

    Object.assign(CFG.data, {
      clinic:v('r-clinic'), doctor:v('r-doctor'), phone:v('r-phone'),
      country:v('r-country'), gov:v('r-gov'), area:v('r-area'),
      landmark:v('r-landmark'), registered:true,
    });
    await CFG.save();
    await CFG.register();
    $('#regbox')?.remove();
    toast(T('saved'), 's');
    Login.draw();
    $('#lg-roles').classList.remove('hide');
  },
};

/*═══════════════ استمارة التاريخ الطبي ═══════════════
  مطابقة لاستمارة العيادة الورقية — ٢٢ سؤالاً بأقسامها
═══════════════════════════════════════════════════════*/
const MH = {
  render(vals, gender, editable){
    vals = vals || {};
    const groups = ['gen','car','alg','med'];
    let html = '';

    for (const g of groups){
      const qs = MHQ.filter(q => q.g===g && !q.f);
      if (!qs.length) continue;
      html += `<div class="mt2"><div class="lbl">${MHG[g][LG]}</div><div class="col mt">
        ${qs.map(q => this.q(q, vals, editable)).join('')}
      </div></div>`;
    }

    /* قسم النساء يظهر فقط للإناث */
    if (gender === 'female'){
      const qs = MHQ.filter(q => q.f);
      html += `<div class="mt2">
        <div class="al i"><span>♀</span><span>${MHG.fem[LG]}</span></div>
        <div class="col mt">${qs.map(q=>this.q(q, vals, editable)).join('')}</div></div>`;
    }
    return html;
  },

  q(q, vals, editable){
    const v = vals[q.c] || {};
    const on = !!v.y;
    const dang = q.risk === 2;
    const txt = isAr()? q.ar : q.en;
    const dis = editable === false ? 'style="pointer-events:none;opacity:.85"' : '';
    return `<div>
      <div class="chk ${on?'on':''} ${dang?'dang':''}" id="mhc-${q.c}" ${dis}
           onclick="MH.toggle('${q.c}')">
        <div class="bx">✓</div>
        <div class="gr">${esc(txt)}</div>
        ${q.risk===2?'<span class="pill r">⚠</span>':q.risk===1?'<span class="pill w">!</span>':''}
      </div>
      ${q.d ? `<div id="mhd-${q.c}" class="${on?'':'hide'}" style="margin-top:7px;padding-inline-start:12px">
        <input id="mhi-${q.c}" placeholder="${esc(q.dl || (isAr()?'التفاصيل':'Details'))}"
               value="${esc(v.d||'')}" ${editable===false?'disabled':''}>
      </div>` : ''}
    </div>`;
  },

  toggle(c){
    const box = $('#mhc-'+c); if (!box) return;
    box.classList.toggle('on');
    const d = $('#mhd-'+c);
    if (d) d.classList.toggle('hide', !box.classList.contains('on'));
  },

  collect(){
    const out = {};
    for (const q of MHQ){
      const box = $('#mhc-'+q.c); if (!box) continue;
      const on = box.classList.contains('on');
      if (!on) continue;
      out[q.c] = { y:true, d: ($('#mhi-'+q.c)?.value || '').trim() };
    }
    return out;
  },

  /* التنبيهات الحرجة المستخرجة من الإجابات */
  alerts(vals, forPharmacy){
    if (!vals) return [];
    const out = [];
    for (const q of MHQ){
      const v = vals[q.c];
      if (!v?.y || !q.al) continue;
      if (forPharmacy && !q.ph) continue;
      out.push({ risk:q.risk, txt:(isAr()?q.al:(q.alE||q.al)), d:v.d });
    }
    return out.sort((a,b)=>b.risk-a.risk);
  },

  alertsHtml(vals, forPharmacy){
    const a = this.alerts(vals, forPharmacy);
    if (!a.length) return `<div class="al g"><span>✓</span><span>${T('noAlerts')}</span></div>`;
    return `<div class="col">${a.map(x=>`
      <div class="al ${x.risk===2?'r':'w'}">
        <span>${x.risk===2?'⚠':'!'}</span>
        <span>${esc(x.txt)}${x.d?` — <b>${esc(x.d)}</b>`:''}</span>
      </div>`).join('')}</div>`;
  },
};

/*═══════════════ نموذج المراجع ═══════════════
  كل الحقول من الاستمارة الورقية — الاسم رباعي إجباري
═══════════════════════════════════════════════════════*/

    this._prevId = p.id || null;
    const f=(id,lb,val,extra='')=>`<div><label class="lb">${lb} <span class="req">*</span></label>
      <input id="${id}" value="${esc(val||'')}" ${extra}></div>`;
    return `
      <div><label class="lb">${T('fullname')} <span class="req">*</span></label>
        <input id="f-name" value="${esc(nm(p))}" placeholder="${T('nameHint')}"></div>
      <div class="g2 mt">
        <div><label class="lb">${T('age')} <span class="req">*</span></label>
          <input id="f-age" class="mono" inputmode="numeric" dir="ltr" value="${esc(p.age||'')}"></div>
        <div><label class="lb">${T('gender')} <span class="req">*</span></label>
          <div class="row" style="gap:8px">
            <button type="button" class="btn gh gr" id="f-gm" onclick="Form.setG('male')">${T('male')}</button>
            <button type="button" class="btn gh gr" id="f-gf" onclick="Form.setG('female')">${T('female')}</button>
          </div></div>
      </div>
      <div class="mt">${f('f-phone',T('phone'),p.phone,'dir="ltr" class="mono" inputmode="tel"')}</div>
      <div class="mt">${f('f-addr',T('address'),p.address)}</div>
      <div class="mt">${f('f-job',T('job'),p.job)}</div>
      <div class="mt"><label class="lb">${T('complaint')} <span class="req">*</span></label>
        <textarea id="f-comp">${esc(p.complaint||'')}</textarea></div>

      <div class="mt3"><div class="h3">${T('healthInfo')}</div>
        <div class="sub">${T('markYes')}</div></div>
      <div id="f-mh">${MH.render(p.mh, p.gender, true)}</div>

      <div class="mt2"><label class="lb">${T('prevDental')}</label>
        <textarea id="f-prev">${esc(p.prevDental||'')}</textarea></div>
      <div class="mt"><label class="lb">${T('otherInfo')}</label>
        <textarea id="f-other">${esc(p.other||'')}</textarea></div>`;
  },

  wire(){
    if (this.gender) this.setG(this.gender);
    /* اقتراح من سجلّ المراجعين نفسه — اختيار الاسم يملأ كل الحقول */
    this.attachPatientSearch($('#f-name'));
    SG.attach($('#f-addr'),'address');
    SG.attach($('#f-job'),'job');
    SG.attach($('#f-comp'),'complaint');
  },

  /* بحث حيّ في ملفات المراجعين أثناء كتابة الاسم */
  attachPatientSearch(inp){
    if (!inp) return;
    inp.parentElement.classList.add('sgw');
    let box = null, tm = null;
    const close = () => { if (box){ box.remove(); box = null; } };

    const show = async () => {
      const q = inp.value.trim();
      close();
      if (q.length < 2) return;
      const ps = (await Ops.patients(q)).slice(0, 6);
      if (!ps.length) return;

      box = el(`<div class="sgs">${ps.map(p=>`
        <div style="display:flex;align-items:center;gap:9px">
          <span class="av" style="width:30px;height:30px;font-size:13px">${esc(nm(p).charAt(0))}</span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-weight:700" class="ell">${esc(nm(p))}</span>
            <span class="tiny">${p.age||'—'} ${T('yrs')} · ${esc(p.address||'—')}</span>
          </span>
          <span class="pill b" style="font-size:10px">${T('prevPatient')}</span>
        </div>`).join('')}</div>`);

      [...box.children].forEach((d,i) => d.onmousedown = e => {
        e.preventDefault(); close(); Form.fillFrom(ps[i]);
      });
      inp.parentElement.appendChild(box);
    };

    inp.addEventListener('focus', show);
    inp.addEventListener('input', ()=>{ clearTimeout(tm); tm = setTimeout(show, 200); });
    inp.addEventListener('blur', ()=> setTimeout(close, 180));
  },

  /* تعبئة كل البيانات من ملف سابق */
  fillFrom(p){
    const set = (id, v) => { const n = $('#'+id); if (n){ n.value = v ?? ''; n.classList.remove('err'); } };
    set('f-name', nm(p));
    set('f-age', p.age);
    set('f-phone', p.phone);
    set('f-addr', p.address);
    set('f-job', p.job);
    set('f-comp', p.complaint);
    set('f-prev', p.prevDental);
    set('f-other', p.other);
    if (p.gender) this.setG(p.gender);
    /* الاستمارة الصحية تُستعاد أيضاً */
    const box = $('#f-mh');
    if (box) box.innerHTML = MH.render(p.mh, p.gender || this.gender, true);
    this._prevId = p.id;
    toast(T('fillFromPrev'), 's');
  },

  setG(g){
    this.gender = g;
    $('#f-gm').className = 'btn gr ' + (g==='male'?'':'gh');
    $('#f-gf').className = 'btn gr ' + (g==='female'?'':'gh');
    /* قسم النساء يظهر/يختفي فوراً */
    const box = $('#f-mh');
    if (box){
      const cur = MH.collect();
      box.innerHTML = MH.render(cur, g, true);
    }
  },

  validate(){
    const ids = ['f-age','f-phone','f-addr','f-job','f-comp'];
    let bad = false;

    /* الاسم الرباعي إجباري — أربع كلمات على الأقل */
    const nEl = $('#f-name');
    const okName = nEl && nameWords(nEl.value) >= 4;
    if (nEl) nEl.classList.toggle('err', !okName);
    if (!okName) bad = true;

    for (const id of ids){
      const n = $('#'+id); if (!n) continue;
      const ok = n.value.trim().length >= (id==='f-age' ? 1 : 2);
      n.classList.toggle('err', !ok);
      if (!ok) bad = true;
    }
    if (!this.gender){ $('#f-gm').classList.add('err'); $('#f-gf').classList.add('err'); bad = true; }
    return !bad;
  },

  read(){
    const v = id => ($('#'+id)?.value || '').trim();
    const full = v('f-name');
    return {
      name: full, ...splitName(full),
      age:Number(v('f-age'))||null, gender:this.gender,
      phone:v('f-phone'), address:v('f-addr'), job:v('f-job'),
      complaint:v('f-comp'), prevDental:v('f-prev'), other:v('f-other'),
      mh: MH.collect(),
    };
  },

  async learn(d){
    await SG.learn('name', d.name);
    await SG.learn('address', d.address);
    await SG.learn('job', d.job);
    await SG.learn('complaint', d.complaint);
  },
};
/*═══════════════ عمليات مشتركة ═══════════════*/
const Ops = {
  async patients(q){
    const all = await DB.all('patients');
    const s = String(q||'').trim().toLowerCase();
    const list = !s ? all : all.filter(p =>
      nm(p).toLowerCase().includes(s) ||
      (p.phone||'').replace(/\D/g,'').includes(s.replace(/\D/g,'')) && s.replace(/\D/g,'') ||
      String(p.mrn||'').includes(s));
    /* الأحدث نشاطاً أولاً: آخر تعديل، وإلا تاريخ التسجيل */
    return list.sort((a,b)=> ((b.up||b.at||0) - (a.up||a.at||0)));
  },

  async nextMrn(){
    const all = await DB.all('patients');
    const y = new Date().getFullYear();
    const n = all.filter(p=>String(p.mrn||'').startsWith(y+'-')).length + 1;
    return `${y}-${String(n).padStart(4,'0')}`;
  },

  async savePatient(data, id){
    const now = Date.now();
    let p;
    if (id){
      p = await DB.get('patients', id);
      p = { ...p, ...data, up:now };
    } else {
      p = { id:uid(), mrn: await this.nextMrn(), cid: CFG.data.cid, ...data, at:now, up:now };
    }
    await DB.put('patients', p);
    await Form.learn(data);
    return p;
  },

  async openVisit(pid, note){
    const vs = await DB.by('visits','pid',pid);
    const open = vs.find(v=>v.st==='open');
    if (open) return open;
    const v = { id:uid(), pid, cid:CFG.data.cid, code:newCode(), date:today(), at:Date.now(),
                st:'open', qstate:'waiting', no:vs.length+1, note:note||'' };
    await DB.put('visits', v);
    return v;
  },

  async visitTotals(vid){
    const w = (await DB.by('works','vid',vid)).sort((a,b)=>(b.at||0)-(a.at||0));
    const p = (await DB.all('payments')).filter(x=>x.vid===vid);
    return { total:w.reduce((s,x)=>s+Number(x.price||0),0),
             paid: p.reduce((s,x)=>s+Number(x.amt||0),0), works:w };
  },

  async patientTotals(pid){
    const w = (await DB.by('works','pid',pid));
    const p = (await DB.by('payments','pid',pid));
    const total = w.reduce((s,x)=>s+Number(x.price||0),0);
    const paid  = p.reduce((s,x)=>s+Number(x.amt||0),0);
    return { total, paid, due: total-paid };
  },

  async toothMap(pid){
    const rows = await DB.by('tooth','pid',pid);
    const m = {}; rows.forEach(r => m[r.fdi] = r.st);
    return m;
  },

  /* سلسلة جلسات السن: كل الأعمال والدفعات بين "بداية" و"إنهاء" تُحسب معاً.
     عند الإنهاء يرتفع رقم السلسلة فتبدأ جلسات ومدفوعات جديدة نظيفة. */
  async course(pid, fdi){
    const r = await DB.get('tooth', pid+'-'+fdi);
    return r?.course || 1;
  },

  /* حساب سلسلة السن الحالية: الأعمال والمدفوعات المرتبطة بها */
  async courseTotals(pid, fdi){
    const cur = await this.course(pid, fdi);
    const works = (await DB.by('works','pid',pid))
      .filter(w => Number(w.fdi) === Number(fdi) && (w.course || 1) === cur);
    const pays = (await DB.by('payments','pid',pid))
      .filter(x => Number(x.fdi) === Number(fdi) && (x.course || 1) === cur);
    const total = works.reduce((a,x)=>a+Number(x.price||0),0);
    const paid  = pays.reduce((a,x)=>a+Number(x.amt||0),0);
    return { course:cur, works, pays, total, paid, due: total-paid };
  },

  /* دفتر المراجع: كل سن ← سلاسله ← جلساته ← مبلغ كل جلسة ومجموع السن.
     يجيب على: كم مرة جاء؟ كم سناً عولج؟ كل سن كم جلسة وكم دفع؟ */
  async ledger(pid){
    const works = await DB.by('works','pid',pid);
    const pays  = await DB.by('payments','pid',pid);
    const teethRows = await DB.by('tooth','pid',pid);
    const visits = await DB.by('visits','pid',pid);
    const vMap = {}; visits.forEach(v=>vMap[v.id]=v);
    const curOf = {}; teethRows.forEach(t=> curOf[t.fdi] = t.course || 1);

    const teeth = {};
    const addTooth = f => (teeth[f] ||= { fdi:Number(f), courses:{} });
    const addCourse = (f,c) => {
      const t = addTooth(f);
      return (t.courses[c] ||= { n:Number(c), sessions:{}, total:0, paid:0 });
    };

    for (const w of works){
      if (!w.fdi) continue;
      const c = addCourse(w.fdi, w.course || 1);
      const vid = w.vid || 'x';
      const sess = (c.sessions[vid] ||= {
        vid, date: vMap[vid]?.date || null, no: vMap[vid]?.no || null,
        works:[], total:0, paid:0 });
      sess.works.push(w); sess.total += Number(w.price||0);
      c.total += Number(w.price||0);
    }
    for (const x of pays){
      if (!x.fdi) continue;
      const c = addCourse(x.fdi, x.course || 1);
      const vid = x.vid || 'x';
      const sess = (c.sessions[vid] ||= {
        vid, date: vMap[vid]?.date || null, no: vMap[vid]?.no || null,
        works:[], total:0, paid:0 });
      sess.paid += Number(x.amt||0);
      c.paid += Number(x.amt||0);
    }

    /* دفعات غير منسوبة لسن — تُعرض على حدة حتى لا تختفي */
    const loose = pays.filter(x=>!x.fdi);

    const out = Object.values(teeth).map(t => {
      const cs = Object.values(t.courses)
        .map(c => ({
          ...c,
          closed: c.n < (curOf[t.fdi] || 1),
          sessions: Object.values(c.sessions)
            .sort((a,b)=> String(b.date||'').localeCompare(String(a.date||''))),
        }))
        .sort((a,b)=> b.n - a.n);
      return {
        fdi: t.fdi, courses: cs,
        total: cs.reduce((a,c)=>a+c.total,0),
        paid:  cs.reduce((a,c)=>a+c.paid,0),
        visits: cs.reduce((a,c)=>a+c.sessions.length,0),
      };
    }).sort((a,b)=> b.paid - a.paid);

    return {
      teeth: out,
      loose,
      loosePaid: loose.reduce((a,x)=>a+Number(x.amt||0),0),
      allPaid: pays.reduce((a,x)=>a+Number(x.amt||0),0),
      visitCount: visits.length,
      toothCount: out.length,
    };
  },

  /*────────── خطة علاج السن ──────────
    كل سن له ملف مستقل: خطة (نوع العمل وعدد الجلسات) وجلسات
    منفّذة وحساب وأرشيف. عند الختم يبدأ ملف جديد لنفس السن. */
  async toothRec(pid, fdi){
    const id = pid + '-' + fdi;
    return (await DB.get('tooth', id)) ||
           { id, pid, fdi:Number(fdi), st:'sound', course:1, plans:{}, archive:[] };
  },

  async plan(pid, fdi){
    const r = await this.toothRec(pid, fdi);
    return (r.plans || {})[r.course || 1] || null;
  },

  async savePlan(pid, fdi, plan){
    const r = await this.toothRec(pid, fdi);
    r.plans = r.plans || {};
    const c = r.course || 1;
    r.plans[c] = { ...(r.plans[c] || {}), ...plan, at: Date.now() };
    await DB.put('tooth', r);
    return r.plans[c];
  },

  /* الجلسات المنفّذة فعلياً لهذه السلسلة (من سجلّ الأعمال) */
  async doneSessions(pid, fdi){
    const r = await this.toothRec(pid, fdi);
    const c = r.course || 1;
    const ws = (await DB.by('works','pid',pid))
      .filter(w => Number(w.fdi) === Number(fdi) && (w.course||1) === c);
    const nums = new Set();
    ws.forEach(w => (w.sessionNos || []).forEach(n => nums.add(Number(n))));
    return { nums:[...nums].sort((a,b)=>a-b), works:ws };
  },

  /* ختم ملف السن: تُؤرشف الخطة وتبدأ سلسلة جديدة */
  async endCourse(pid, fdi){
    const r = await this.toothRec(pid, fdi);
    const c = r.course || 1;
    const totals = await this.courseTotals(pid, fdi);
    r.archive = r.archive || [];
    const ds = await this.doneSessions(pid, fdi);
    r.archive.push({
      course:c, plan:(r.plans||{})[c] || null,
      total:totals.total, paid:totals.paid,
      sessions:totals.works.length,
      /* يُحفظ ما نُفّذ فعلاً وما كان مخطَّطاً، فيبقى الفرق مقروءاً
         بعد الختم حتى لو أُنهي السن قبل اكتمال جلساته. */
      doneNums: ds.nums,
      planned: ((r.plans||{})[c] || {}).sessions || 0,
      closedAt:Date.now(),
    });
    r.course = c + 1;
    r.closedAt = Date.now();
    await DB.put('tooth', r);
    return r.course;
  },

  /* كل ملفات أسنان المراجع: المفتوحة والمختومة */
  async toothFiles(pid){
    const recs = await DB.by('tooth','pid',pid);
    const works = await DB.by('works','pid',pid);
    const pays  = await DB.by('payments','pid',pid);
    const out = [];

    for (const r of recs){
      const cur = r.course || 1;
      for (let c = 1; c <= cur; c++){
        const ws = works.filter(w => Number(w.fdi)===r.fdi && (w.course||1)===c);
        const ps = pays .filter(x => Number(x.fdi)===r.fdi && (x.course||1)===c);
        const arch = (r.archive||[]).find(a => a.course === c);
        const plan = (r.plans||{})[c] || arch?.plan || null;
        if (!ws.length && !ps.length && !plan) continue;
        const nums = new Set();
        ws.forEach(w => (w.sessionNos||[]).forEach(n => nums.add(Number(n))));
        const sealed  = c < cur;
        const planned = plan?.sessions || 0;
        /* السن المختوم مكتمل دائماً — قرار الطبيب بالإنهاء يعلو
           على عدّاد الجلسات المخطَّطة. */
        const complete = sealed || (planned > 0 && nums.size >= planned);
        out.push({
          fdi:r.fdi, course:c, sealed, plan, st:r.st, planned, complete,
          doneNums:[...nums].sort((a,b)=>a-b),
          works:ws.sort((a,b)=>(b.at||0)-(a.at||0)),
          pays:ps,
          total: ws.reduce((a,x)=>a+Number(x.price||0),0),
          paid:  ps.reduce((a,x)=>a+Number(x.amt||0),0),
          last:  Math.max(0, ...ws.map(w=>w.at||0), ...ps.map(x=>x.at||0)),
        });
      }
    }
    return out.sort((a,b)=> (a.sealed - b.sealed) || (b.last - a.last));
  },

  /* تحديث حالة السن فقط — بدمج على السجل القائم.
     الاستبدال الكامل كان يمحو الخطة والأرشيف ورقم السلسلة
     في كل مرة يُحفظ فيها عمل، فتضيع خطة السن بلا سبب ظاهر. */
  async setTooth(pid, fdi, st, vid){
    const r = await this.toothRec(pid, fdi);
    r.st = st; r.vid = vid || null; r.at = Date.now();
    await DB.put('tooth', r);
  },

  /* حذف مراجع نهائياً: يمسح كل ما يتعلّق به في كل المخازن،
     فلا تبقى جلسة يتيمة ولا دفعة بلا صاحب. */
  async deletePatient(pid){
    for (const st of ['visits','works','payments','files','rx','tooth','appts']){
      for (const row of await DB.by(st, 'pid', pid)) await DB.del(st, row.id);
    }
    for (const b of (await DB.all('bookings')).filter(x=>x.pid===pid))
      await DB.del('bookings', b.id);
    await DB.del('patients', pid);
  },

  /* إزالة جلسة واحدة: تختفي من قائمة اليوم ويبقى ملف المراجع */
  async deleteVisit(vid){
    for (const w of await DB.by('works','vid',vid))   await DB.del('works', w.id);
    for (const r of await DB.by('rx','vid',vid))      await DB.del('rx', r.id);
    for (const f of await DB.by('files','vid',vid))   await DB.del('files', f.id);
    for (const x of (await DB.all('payments')).filter(p=>p.vid===vid))
      await DB.del('payments', x.id);
    await DB.del('visits', vid);
  },

  async findByCode(code){
    const vs = await DB.all('visits');
    return vs.find(v => v.code === String(code||'').trim().toUpperCase()) || null;
  },
};

/*═══════════════ قائمة جلسات المراجع ═══════════════
  تظهر أسفل كل صفحة جلسة، فيتنقّل المستخدم بين الجلسات مباشرة.
═══════════════════════════════════════════════════*/
async function sessionsList(pid, activeVid){
  const vs = (await DB.by('visits','pid',pid)).sort((a,b)=>(b.at||0)-(a.at||0));
  if (!vs.length) return '';

  const rows = [];
  for (const v of vs){
    const tt = await Ops.visitTotals(v.id);
    const on = v.id === activeVid;
    const live = v.qstate==='called' || v.qstate==='chair';
    const teeth = [...new Set(tt.works.map(w=>Number(w.fdi)).filter(Boolean))];
    rows.push(`
      <div class="it ${live?'live':''}" style="${on?'border-color:var(--br);background:var(--brL)':''}"
           onclick="${on?'':`Nav.session('${v.id}')`}">
        <div class="av ${v.st==='open'?'':'g'}">${v.no}</div>
        <div class="gr">
          <div class="row" style="gap:6px">
            <span class="mono" style="font-weight:700">${fmtD(v.date)}</span>
            ${on?`<span class="pill b">${T('currentSession')}</span>`
                :v.st==='open'?`<span class="pill w">${T('openSession')}</span>`:''}
          </div>
          <div class="row wrapv" style="gap:4px;margin-top:4px">
            ${teeth.length ? teeth.map(f=>`<span class="pill n mono"
                style="font-size:10.5px;padding:2px 7px">${Chart.lbl(f)}</span>`).join('')
              : `<span class="tiny">—</span>`}
          </div>
        </div>
        <div style="text-align:end">
          <div class="mono" style="font-weight:700;color:var(--ok)">${N(tt.paid)}</div>
          <div class="tiny">${tt.works.length} ${T('workCount')}</div>
        </div>
      </div>`);
  }

  return `<div class="card mt2">
    <div class="row" style="justify-content:space-between">
      <div class="lbl">${T('sessions')}</div><span class="pill n">${vs.length}</span>
    </div>
    <div class="col mt">${rows.join('')}</div>
  </div>`;
}
