/*═══════════════ السكرتير ═══════════════*/
const Sec = {

  /*──── اليوم: طابور المراجعين + بحث + استدعاء ────*/
  qq:'',

  /* الهيكل يُبنى مرة واحدة، والبحث يحدّث القائمة فقط —
     إعادة بناء الحقل مع كل حرف كانت تُفقد التركيز وتُلغي الكتابة. */
  async today(){
    const v = $('#view');
    if (!$('#q-today')){
      v.innerHTML = `
        <div class="sbar">
          <input id="q-today" placeholder="${T('searchQ')}" value="${esc(this.qq)}">
          <span class="pill b" id="q-count">0</span>
        </div>
        ${S.role==='doctor'?`<div class="tiny ctr" style="margin-top:7px;color:var(--ink3)">
          ${T('holdHint')}</div>`:''}
        <div id="q-list" class="col mt2"></div>`;
      const inp = $('#q-today');
      let tm;
      inp.addEventListener('input', () => {
        this.qq = inp.value;
        clearTimeout(tm);
        tm = setTimeout(() => this.queue(), 180);
      });
    }
    return this.queue();
  },

  async queue(){
    const box = $('#q-list'); if (!box) return;

    /* الترقيم بترتيب الوصول، والعرض من الأحدث للأقدم */
    const vs = (await DB.all('visits')).filter(x=>x.date===today())
                .sort((a,b)=>(a.at||0)-(b.at||0));
    vs.forEach((x,i)=> x._no = i+1);
    vs.reverse();

    const q = this.qq.trim().toLowerCase();
    const qd = q.replace(/\D/g,'');
    const rows = [];
    for (const vi of vs){
      const p = await DB.get('patients', vi.pid); if (!p) continue;
      if (q && !( nm(p).toLowerCase().includes(q)
               || String(p.mrn||'').toLowerCase().includes(q)
               || (qd && (p.phone||'').replace(/\D/g,'').includes(qd)) )) continue;
      rows.push({ vi, p, tt: await Ops.visitTotals(vi.id) });
    }

    const cls    = { waiting:'n', called:'w', chair:'b', done:'g' };
    const nextOf = { waiting:'called', called:'chair', chair:'done' };
    const lblOf  = { waiting:T('call'), called:T('seat'), chair:T('finish') };

    const cnt = $('#q-count'); if (cnt) cnt.textContent = rows.length;

    box.innerHTML = rows.length ? rows.map(({vi,p,tt})=>{
      const live = vi.qstate==='called' || vi.qstate==='chair';
      return `
      <div class="it ${live?'live':''}" onclick="Nav.session('${vi.id}')"
        ${S.role==='doctor'?`data-hold="Del.todayRow('${vi.id}','${p.id}')"`:''}>
        <div class="av ${vi.qstate==='done'?'g':vi.qstate==='chair'?'':'w'}">${vi._no}</div>
        <div class="gr">
          <div class="row" style="gap:6px">
            ${live?'<span class="dotlive"></span>':''}
            <div class="h3 ell">${esc(nm(p))}</div>
            ${vi.needAppt?`<span class="pill w">${T('needAppt')}</span>`:''}
          </div>
          <div class="mono tiny">${T('file')} ${esc(p.mrn)} · ${T('total')} ${N(tt.total)}
            · <span style="color:var(--ok);font-weight:700">${T('paid')} ${N(tt.paid)}</span></div>
        </div>
        <div class="col" style="gap:5px;align-items:flex-end">
          <span class="pill ${cls[vi.qstate]||'n'}">${T(vi.qstate==='chair'?'inChair':vi.qstate||'waiting')}</span>
          ${nextOf[vi.qstate||'waiting'] && S.role!=='pharmacy'
            ? `<button class="btn xs ${vi.qstate==='chair'?'ok':''}"
                 onclick="event.stopPropagation();Sec.setQ('${vi.id}','${nextOf[vi.qstate||'waiting']}')">
                 ${lblOf[vi.qstate||'waiting']}</button>` : ''}
        </div>
      </div>`;}).join('') : `<div class="emp">${T('noQueue')}</div>`;
  },

  /* انتقال حالة الدور: بالانتظار ← استدعاء ← على الكرسي ← إنهاء */
  async setQ(vid, st){
    const v = await DB.get('visits', vid);
    v.qstate = st;
    if (st === 'done'){ v.st = 'done'; }
    await DB.put('visits', v);
    if (st === 'done') return Appt.ask(v.pid, vid);
    toast(T(st==='chair'?'inChair':st==='done'?'done':'called'), 's');
    this.today();
  },

  /*──── الحجوزات الواردة من تطبيق المراجع ────*/
  bq:'',
  async books(){
    const v = $('#view');
    const q = this.bq.trim().toLowerCase();
    let bs = (await DB.all('bookings')).filter(b=>b.st==='new')
                .sort((a,b)=>(b.at||0)-(a.at||0));
    if (q) bs = bs.filter(b =>
      nm(b).toLowerCase().includes(q) ||
      (b.phone||'').replace(/\D/g,'').includes(q.replace(/\D/g,'')));

    /* البحث وتسجيل مراجع مباشر — هنا مكانهما الطبيعي */
    const head = `<div class="sbar">
        <input id="q-book" placeholder="${T('search')}" value="${esc(this.bq)}">
        <button class="btn" onclick="Sec.newPt()">＋ ${T('addPatient')}</button>
      </div>`;

    v.innerHTML = head + (bs.length ? `<div class="col mt2">${bs.map(b=>{
      const al = MH.alerts(b.mh);
      return `<div class="card">
        <div class="row">
          <div class="av w">${esc(nm(b).charAt(0)||'?')}</div>
          <div class="gr">
            <div class="h3">${esc(nm(b))}</div>
            <div class="mono tiny">${b.age||'—'} ${T('yrs')} · ${esc(b.phone)}</div>
          </div>
          <span class="pill i">${fmtD(b.day)} ${esc(b.time||'')}</span>
        </div>
        ${b.complaint?`<div class="mt" style="padding:11px;background:var(--card2);
          border-radius:11px;font-size:13.5px;font-weight:600">${esc(b.complaint)}</div>`:''}
        ${al.length?`<div class="row mt" style="gap:6px">
          <span class="pill ${al[0].risk===2?'r':'w'}">${al[0].risk===2?'⚠':'!'} ${al.length}</span>
        </div>`:''}
        <div class="row mt" style="gap:8px">
          <button class="btn gh gr" onclick="Sec.decide('${b.id}',0)">${T('decline')}</button>
          <button class="btn sf gr" onclick="Sec.bookInfo('${b.id}')">${T('bookDetails')}</button>
          <button class="btn gr" onclick="Sec.decide('${b.id}',1)">${T('accept')}</button>
        </div>
      </div>`;}).join('')}</div>` : `<div class="emp mt2">${T('noBook')}</div>`);

    const inp = $('#q-book');
    if (inp && !inp._wired){
      inp._wired = true;
      let tm;
      inp.addEventListener('input', ()=>{ this.bq = inp.value;
        clearTimeout(tm); tm = setTimeout(()=>this.books(), 200); });
      if (this.bq){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }
  },

  /* تفاصيل الحجز كاملة قبل القبول — مع بيان إن كان مراجعاً سابقاً */
  async bookInfo(id){
    const b = await DB.get('bookings', id); if (!b) return;
    const phone = (b.phone||'').replace(/\D/g,'');
    const cid = b.cid || CFG.data.cid;
    const all = (await DB.all('patients')).filter(x => !x.cid || x.cid === cid);
    const old = all.find(x => (x.phone||'').replace(/\D/g,'') === phone);
    const prev = old ? (await DB.by('visits','pid',old.id)) : [];

    const row = (k,v) => `<div class="row" style="justify-content:space-between;
      padding:11px 0;border-bottom:1px solid var(--line2)">
      <span class="tiny" style="font-weight:700">${k}</span>
      <span style="font-weight:600;text-align:end">${esc(v||'—')}</span></div>`;

    UI.sheet(`
      <div class="shhead"><div class="gr">
        <div class="h2">${esc(nm(b))}</div>
        <div class="sub">${T('bookDetails')} · ${fmtD(b.day)} ${esc(b.time||'')}</div>
      </div><button class="ib" onclick="Nav.back()">✕</button></div>

      <div class="al ${old?'i':'g'}">
        <span>${old?'↻':'★'}</span>
        <span>${old ? `<b>${T('returning')}</b> — ${prev.length} ${T('prevVisits')}`
                     : `<b>${T('firstVisit')}</b>`}</span>
      </div>

      <div class="card mt">
        ${row(T('fullname'), nm(b))}
        ${row(T('age'), (b.age||'—')+' '+T('yrs'))}
        ${row(T('gender'), b.gender==='female'?T('female'):T('male'))}
        ${row(T('phone'), b.phone)}
        ${row(T('address'), b.address)}
        ${row(T('job'), b.job)}
      </div>

      <div class="card">
        <div class="lbl">${T('complaint')}</div>
        <div class="mt" style="font-weight:600;line-height:1.6">${esc(b.complaint||'—')}</div>
      </div>

      <div class="card">
        <div class="lbl">${T('alerts')}</div>
        <div class="mt">${MH.alertsHtml(b.mh)}</div>
      </div>

      <div class="card">
        <div class="lbl">${T('healthInfo')}</div>
        <div class="mt">${MH.render(b.mh, b.gender, false)}</div>
      </div>

      ${b.prevDental?`<div class="card"><div class="lbl">${T('prevDental')}</div>
        <div class="mt" style="font-weight:600">${esc(b.prevDental)}</div></div>`:''}
      ${b.other?`<div class="card"><div class="lbl">${T('otherInfo')}</div>
        <div class="mt" style="font-weight:600">${esc(b.other)}</div></div>`:''}

      ${prev.length?`<div class="card">
        <div class="lbl">${T('sessions')}</div>
        <div class="col mt">${prev.sort((a,b2)=>(b2.at||0)-(a.at||0)).slice(0,8).map(v=>`
          <div class="it" style="cursor:default">
            <div class="av g">${v.no}</div>
            <div class="gr"><div class="h3">${fmtD(v.date)}</div>
              <div class="tiny mono">${esc(v.code)}</div></div>
          </div>`).join('')}</div></div>`:''}

      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Sec.decide('${id}',0)">${T('decline')}</button>
        <button class="btn gr" style="flex:2" onclick="Sec.decide('${id}',1)">${T('accept')}</button>
      </div>`);
  },

  async decide(id, ok){
    const b = await DB.get('bookings', id); if (!b) return;
    if (!ok){ b.st='declined'; await DB.put('bookings',b); toast(T('declined'));
      return Nav.home(); }

    /* القبول ينشئ ملف المراجع كاملاً ببياناته التي أدخلها بنفسه */
    const all = await DB.all('patients');
    let p = all.find(x => x.phone.replace(/\D/g,'') === (b.phone||'').replace(/\D/g,''));
    const data = { name:nm(b), n1:b.n1,n2:b.n2,n3:b.n3,n4:b.n4, age:b.age, gender:b.gender,
                   phone:b.phone, address:b.address, job:b.job,
                   complaint:b.complaint, prevDental:b.prevDental, other:b.other, mh:b.mh };
    p = await Ops.savePatient(data, p?.id);
    b.st='accepted'; b.pid=p.id; await DB.put('bookings', b);
    await Ops.openVisit(p.id, b.complaint);
    toast(T('accepted'),'s');
    Nav.home();
  },

  /*──── الملفات والبحث ────*/
  async files(q){
    const v = $('#view');
    if (!$('#sc-q')){
      v.innerHTML = `
        <div class="sbar"><input id="sc-q" placeholder="${T('search')}" value="${esc(q||'')}"></div>
        ${S.role==='doctor'?`<div class="tiny ctr" style="margin-top:7px;color:var(--ink3)">
          ${T('holdHint')}</div>`:''}
        <div id="sc-list" class="col mt2"></div>`;
      const i = $('#sc-q'); let tm;
      i.oninput = ()=>{ clearTimeout(tm); tm=setTimeout(()=>Sec.list(i.value),220); };
    }
    this.list(q||'');
  },

  async list(q){
    const box = $('#sc-list'); if (!box) return;
    const ps = await Ops.patients(q);
    const rows = [];
    for (const p of ps.slice(0,60)){
      const t = await Ops.patientTotals(p.id);
      rows.push(`<div class="it" onclick="Sec.file('${p.id}')"
        ${S.role==='doctor'?`data-hold="Del.patient('${p.id}')"`:''}>
        <div class="av">${esc(nm(p).charAt(0))}</div>
        <div class="gr">
          <div class="h3 ell">${esc(nm(p))}</div>
          <div class="mono tiny">${T('file')} ${esc(p.mrn)} · ${esc(p.phone)}</div>
        </div>
        ${t.due>0?`<span class="pill r">${N(t.due)}</span>`:`<span class="pill g">✓</span>`}
      </div>`);
    }
    box.innerHTML = rows.length ? rows.join('') : `<div class="emp">${T('noResult')}</div>`;
  },

  /*──── تسجيل مراجع جديد مباشر (بلا حجز) ────*/
  newPt(edit){
    const sh = UI.sheet(`
      <div class="h1">${edit ? T('edit') : T('addPatient')}</div>
      <div class="mt2">${Form.html(edit)}</div>
      <div id="f-err" class="al r mt2 hide"></div>
      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn gr" style="flex:2" onclick="Sec.savePt('${edit?edit.id:''}')">${T('save')}</button>
      </div>`);
    Form.wire();
    sh.scrollTop = 0;
  },

  async savePt(id){
    if (!Form.validate()){
      const e = $('#f-err'); e.textContent = T('fillAll'); e.classList.remove('hide');
      $('.sh').scrollTo({top:0,behavior:'smooth'}); return;
    }
    /* إن اختير مراجع سابق من الاقتراح، نحدّث ملفه بدل إنشاء ملف مكرّر */
    const target = id || Form._prevId || null;
    const p = await Ops.savePatient(Form.read(), target);
    UI.close(); toast(T('saved'),'s');
    /* الملف يحلّ محلّ نموذج التسجيل — الرجوع منه لا يعيد فتح النموذج */
    Nav.stack.pop();
    this.file(p.id);
  },

  /*──── ملف المراجع — تخطيط مضغوط بلا فراغات ────*/
  async file(pid){
    const sh = UI.sheet(UI.spin());
    const p = await DB.get('patients', pid); if (!p) return;
    S.patient = p;

    const L  = await Ops.ledger(pid);
    const files = await Ops.toothFiles(pid);
    const vs = (await DB.by('visits','pid',pid)).sort((a,b)=>(b.at||0)-(a.at||0));
    const needAppt  = vs.filter(v => v.needAppt);
    const nextAppts = await Appt.forPatient(pid);
    const alerts = MH.alerts(p.mh);

    /* الجلسات */
    const visitRows = [];
    for (const v of vs){
      const tt = await Ops.visitTotals(v.id);
      const teeth = [...new Set(tt.works.map(w=>Number(w.fdi)).filter(Boolean))];
      visitRows.push(`
        <div class="it" onclick="Nav.session('${v.id}')">
          <div class="av ${v.st==='open'?'':'g'}">${v.no}</div>
          <div class="gr">
            <div class="row" style="gap:6px">
              <span class="mono" style="font-weight:700">${fmtD(v.date)}</span>
              ${v.st==='open'?`<span class="pill b">${T('openSession')}</span>`:''}
              ${v.needAppt?`<span class="pill w">${T('needAppt')}</span>`:''}
            </div>
            <div class="row wrapv" style="gap:4px;margin-top:4px">
              ${teeth.map(f=>`<span class="pill n mono" style="font-size:10.5px;padding:2px 7px">
                ${Chart.lbl(f)}</span>`).join('') || `<span class="tiny">—</span>`}
            </div>
          </div>
          <div style="text-align:end">
            <div class="mono" style="font-weight:700;color:var(--ok)">${N(tt.paid)}</div>
            <div class="tiny">${tt.works.length} ${T('workCount')}</div>
          </div>
        </div>`);
    }

    sh.innerHTML = `
      <div class="shhead">
        <div class="av">${esc(nm(p).charAt(0))}</div>
        <div class="gr">
          <div class="h2">${esc(nm(p))}</div>
          <div class="mono tiny">${p.age||'—'} ${T('yrs')} ·
            ${p.gender==='female'?T('female'):T('male')} ·
            ${T('file')} ${esc(p.mrn||'')} · ${esc(p.phone||'')}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      <div class="card">
        <div class="g3">
          <div class="ctr"><div class="tiny">${T('grandTotal')}</div>
            <div class="mono h2" style="color:var(--ok)">${N(L.allPaid)}</div></div>
          <div class="ctr"><div class="tiny">${T('visitsCount')}</div>
            <div class="mono h2">${L.visitCount}</div></div>
          <div class="ctr"><div class="tiny">${T('teethTreated')}</div>
            <div class="mono h2">${L.toothCount}</div></div>
        </div>
      </div>

      ${alerts.length?`<div class="card">
        <div class="lbl">${T('alerts')}</div>
        <div class="col mt">${alerts.map(x=>`
          <div class="al ${x.risk===2?'r':'w'}"><span>${x.risk===2?'⚠':'!'}</span>
          <span>${esc(x.txt)}${x.d?` — <b>${esc(x.d)}</b>`:''}</span></div>`).join('')}</div>
      </div>`:''}

      ${needAppt.length?`<div class="al w mt">
        <span>!</span><span>${T('needAppt')} — ${T('bySec')}</span></div>`:''}

      <div class="card">
        <div class="lbl">${T('sessionActions')}</div>
        <div class="g2 mt">
          <button class="btn" onclick="Sec.start('${pid}')">＋ ${T('newVisit')}</button>
          <button class="btn sf" onclick="Sec.pay('${pid}')">₪ ${T('pay')}</button>
          <button class="btn gh" onclick="Sec.apptNew('${pid}')">📅 ${T('newAppt')}</button>
          <button class="btn gh" onclick="Sec.newPt(S.patient)">✎ ${T('editPt')}</button>
          <button class="btn gh" onclick="Sec.showMH('${pid}')">♡ ${T('healthInfo')}</button>
          <button class="btn gh" onclick="Money.ptVisits('${pid}')">₪ ${T('perTooth')}</button>
        </div>
        ${Perm.chart()?`<button class="btn w gh mt" onclick="Doc.open('${pid}')">
          🦷 ${T('toothChart')}</button>`:''}
      </div>

      ${nextAppts.length?`<div class="card">
        <div class="lbl">${T('nextVisits')}</div>
        <div class="col mt">${nextAppts.map(a=>{
          const dn = new Date(a.day+'T00:00:00')
            .toLocaleDateString(isAr()?'ar-IQ':'en-GB',{weekday:'long'});
          return `<div class="it" style="cursor:default;border-color:var(--br)">
            <div class="av">📅</div>
            <div class="gr"><div class="h3">${esc(dn)}</div>
              <div class="mono tiny">${fmtD(a.day)} — ${esc(a.time||'')}</div></div>
            <button class="btn xs gh" onclick="Appt.cancel('${a.id}')">✕</button>
          </div>`;}).join('')}</div>
      </div>`:''}

      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="lbl">${T('teethFiles')}</div><span class="pill n">${files.length}</span>
        </div>
        <div class="col mt">${files.length ? files.map(f=>{
          const total = f.plan?.sessions || 0;
          const done  = f.doneNums.length;
          /* المختوم مكتمل مهما كان عدد جلساته المنفّذة */
          const full  = f.complete;
          const early = f.sealed && total && done < total;
          /* غير المكتمل يومض: جلساته لم تكتمل حسب الخطة */
          return `
          <div class="it ${full?'':'live'}"
               onclick="Doc.openToothFile('${pid}',${f.fdi},${f.course})">
            <div class="av mono ${full?'g':'w'}" style="${f.plan?`background:${P(f.plan.proc).col}22;
              color:${P(f.plan.proc).col}`:''}">${Chart.lbl(f.fdi)}</div>
            <div class="gr">
              <div class="row" style="gap:6px">
                <span class="h3">${T('tooth')} ${Chart.lbl(f.fdi)}</span>
                <span class="pill ${full?'g':'w'}">
                  ${full?`✓ ${T('completed')}`:T('inProgress')}</span>
              </div>
              <div class="tiny ell">${f.plan?esc(pName(f.plan.proc)):'—'}
                ${total?` · ${done}/${total} ${T('toothVisits')}`:''}</div>
              ${early?`<div class="tiny" style="color:var(--wr)">${T('sealedEarly')}</div>`:''}
              ${total?`<div class="track" style="height:6px;margin-top:5px">
                <i style="width:${full?100:Math.min(100,Math.round(done/total*100))}%;
                  background:${full?'var(--ok)':P(f.plan.proc).col}"></i>
              </div>`:''}
            </div>
            <div style="text-align:end">
              <div class="mono" style="font-weight:700;color:var(--ok)">${N(f.paid)}</div>
              <div class="tiny">${f.last?fmtD(f.last):''}</div>
            </div>
          </div>`;}).join('') : `<div class="emp">${T('noLedger')}</div>`}</div>
      </div>

      <details class="acc">
        <summary><span class="accic">📅</span>
          <span class="gr">${T('allVisits')}</span>
          <span class="pill n">${vs.length}</span>
          <span class="ar">${isAr()?'‹':'›'}</span></summary>
        <div class="bd"><div class="col">
          ${visitRows.join('') || `<div class="emp">${T('noVisits')}</div>`}</div></div>
      </details>

      ${S.role==='doctor'?`<button class="btn w dg mt2"
        onclick="Del.patient('${pid}')">${T('delPt')}</button>`:''}
      <button class="btn w gh mt2" onclick="Nav.back()">${T('close')}</button>`;
  },

  async showMH(pid){
    const p = await DB.get('patients', pid);
    UI.sheet(`<div class="h2">${T('healthInfo')}</div>
      <div class="sub">${esc(nm(p))}</div>
      <div class="mt2">${MH.alertsHtml(p.mh)}</div>
      <div class="mt2">${MH.render(p.mh, p.gender, false)}</div>

    const v = await DB.get('visits', vid);
    const proc = $('#w-p').value;
    const fdi  = Number($('#w-f').value)||null;
    const w = { id:uid(), vid, pid:v.pid, proc, fdi,
                course: fdi ? await Ops.course(v.pid, fdi) : null,
                by: S.role,   /* الطبيب يعرف من سجّل العمل */
                price:Number($('#w-a').value)||0, note:$('#w-n').value.trim(), at:Date.now() };
    await DB.put('works', w);
    await SG.learn('worknote', w.note);
    const st = P(proc).st;
    if (fdi && st) await Ops.setTooth(v.pid, fdi, st, vid);
    UI.close(); toast(T('saved'),'s');

    const v = await DB.get('visits', vid);

  /*──── استلام دفعة ────*/
  async pay(pid, vid){
    /* أسنان هذه الزيارة — الدفعة تُنسب لسن ليُحسب ضمن سلسلته */
    let teeth = [];
    if (vid){
      const w = await DB.by('works','vid',vid);
      teeth = [...new Set(w.map(x=>Number(x.fdi)).filter(Boolean))];
    } else {
      const w = await DB.by('works','pid',pid);
      teeth = [...new Set(w.map(x=>Number(x.fdi)).filter(Boolean))].slice(0,12);
    }

    UI.sheet(`
      <div class="shhead"><div class="gr"><div class="h2">${T('pay')}</div></div>
        <button class="ib" onclick="Nav.back()">✕</button></div>
      <div class="card"><label class="lb">${T('amount')} <span class="req">*</span></label>
        <input id="p-a" class="mono" inputmode="numeric" dir="ltr" style="font-size:24px;text-align:center"></div>
      ${teeth.length?`<div class="card">
        <label class="lb">${T('payFor')}</label>
        <div class="row wrapv" style="gap:6px" id="p-fdi">
          <button class="btn sm on" data-v="" onclick="Sec.pickFdi(this)">${T('general')}</button>
          ${teeth.map(f=>`<button class="btn sm gh mono" data-v="${f}"
             onclick="Sec.pickFdi(this)">${Chart.lbl(f)}</button>`).join('')}
        </div></div>`:'<div id="p-fdi" class="hide"></div>'}
      <div class="card"><label class="lb">${T('method')}</label>
        <div class="segs mt" id="p-m">
          <button class="on" data-v="cash" onclick="Sec.pm(this)">${T('cash')}</button>
          <button data-v="card" onclick="Sec.pm(this)">${T('card')}</button>
          <button data-v="transfer" onclick="Sec.pm(this)">${T('transfer')}</button>
        </div></div>
        <div class="mt"><label class="lb">${T('notes')}</label><input id="p-n"></div>
      </div>
      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn ok gr" style="flex:2" onclick="Sec.savePay('${pid}','${vid||''}')">${T('save')}</button>
      </div>`);
    setTimeout(()=>$('#p-a')?.focus(),140);
  },
  pm(b){ [...b.parentElement.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); },
  pickFdi(b){
    [...b.parentElement.children].forEach(x=>{ x.classList.remove('on'); x.classList.add('gh'); });
    b.classList.add('on'); b.classList.remove('gh');
  },

  async savePay(pid, vid){
    const a = Number($('#p-a').value);
    if (!a || a<=0){ $('#p-a').classList.add('err'); return; }
    const method = $('#p-m .on')?.dataset.v || 'cash';
    const fdiSel = $('#p-fdi .on')?.dataset.v || '';
    const fdi = fdiSel ? Number(fdiSel) : null;
    await DB.put('payments', {
      id:uid(), pid, vid:vid||null, amt:a, method, fdi,
      course: fdi ? await Ops.course(pid, fdi) : null,
      note:$('#p-n').value.trim(), at:Date.now() });
    UI.close(); toast(T('saved'),'s');
    vid ? this.visit(vid) : this.file(pid);
  },
};

  /*──── ملف السن: الخطة والجلسات والحساب ────*/
  async tooth(fdi){

    const pid = S.patient.id;

    const rec  = await Ops.toothRec(pid, fdi);
    const plan = await Ops.plan(pid, fdi);
    const done = await Ops.doneSessions(pid, fdi);
    const cs   = await Ops.courseTotals(pid, fdi);
    const map  = await Ops.toothMap(pid);
    const st   = map[fdi] || 'sound';
    const col  = TS(st).col;
    const wl   = done.works.find(w => /W\.?L\s?\d+/i.test(w.note||''));
    const arch = (rec.archive||[]).slice().reverse();

    const head = `

    UI.sheet(head + `
      ${plan ? `
      <div class="card">
        <div class="row" style="justify-content:space-between">

              ${left?` · ${T('remaining')} ${left}`:` · ${T('planDone')}`}</div>

          <div style="height:100%;width:${pct}%;background:${P(plan.proc).col};

        </div>
        ${plan.note?`<div class="tiny mt">${esc(plan.note)}</div>`:''}
        ${Perm.addWork() && left && S.visit
          ? `<button class="btn w mt" onclick="Doc.doSession(${fdi})">
              ＋ ${T('planToday')}</button>` : ''}
      </div>` : `<div class="al w"><span>!</span><span>${T('noPlan')}</span></div>`}

          </div>`).join('')}</div>`:`<div class="tiny mt">—</div>`}

          <button class="btn gh w" style="justify-content:space-between;padding:12px 14px"

  /* تسمية الجلسة: مفردة أو مدموجة */
  sessLabel(w){
    const ns = (w.sessionNos||[]).map(Number).sort((a,b)=>a-b);
    if (!ns.length) return T('sessionOf');
    if (ns.length === 1) return `${T('sessionN')} ${ns[0]}`;
    return `${T('mergedS')} ${ns.join(' + ')}`;
  },

  /*──── تفاصيل جلسة سن واحدة ────
    الترتيب مقصود: ملخّص السن ومخطّطه أولاً، ثم العلاج المعطى،
    ثم أرشيف الجلسة، ثم تفاصيلها، ثم مبلغها، وأخيراً ما كتبه الطبيب.
    تعمل للسلاسل المفتوحة والمختومة معاً لأنها تقرأ سلسلة العمل نفسه. */
  async sessionCard(pid, fdi, wid){
    const works = await DB.by('works','pid',pid);
    const w = works.find(x => x.id === wid);
    if (!w) return toast(T('noResult'),'e');

    const p   = await DB.get('patients', pid);
    const rec = await Ops.toothRec(pid, fdi);
    const c   = w.course || 1;
    const cur = rec.course || 1;
    const arc = (rec.archive || []).find(a => a.course === c) || null;
    /* الخطة تُقرأ من سلسلة هذا العمل، لا من السلسلة الحالية */
    const plan   = (rec.plans || {})[c] || arc?.plan || null;
    const sealed = c < cur;

    const cWorks = works.filter(x => Number(x.fdi) === Number(fdi) && (x.course||1) === c)
                        .sort((a,b)=>(a.at||0)-(b.at||0));
    const nums = new Set();
    cWorks.forEach(x => (x.sessionNos||[]).forEach(n => nums.add(Number(n))));
    const total = plan?.sessions || 0;
    const done  = nums.size;
    const full  = sealed || (total && done >= total);
    const early = sealed && total && done < total;
    const pct   = total ? Math.min(100, Math.round(done/total*100)) : 0;

    const map   = await Ops.toothMap(pid);
    const pays  = (await DB.by('payments','pid',pid))
      .filter(x => x.vid === w.vid && Number(x.fdi) === Number(fdi))
      .sort((a,b)=>(b.at||0)-(a.at||0));
    const paid  = pays.reduce((a,x)=>a+Number(x.amt||0),0);
    const files = (await DB.by('files','pid',pid)).filter(f => f.vid === w.vid);
    const visit = w.vid ? await DB.get('visits', w.vid) : null;
    const col   = P(w.proc).col;

    const sec = (icon, title, body, extra) => `
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="row" style="gap:8px">
            <span class="accic" style="width:28px;height:28px;font-size:14px">${icon}</span>
            <span class="lbl">${title}</span>
          </div>
          ${extra || ''}
        </div>
        ${body}
      </div>`;

    UI.sheet(`
      <div class="shhead">
        <div class="av mono" style="width:50px;height:50px;font-size:15px;
          background:${col}22;color:${col};border:2px solid ${col}">${Chart.lbl(fdi)}</div>
        <div class="gr">
          <div class="h2">${this.sessLabel(w)}</div>
          <div class="tiny">${esc(nm(p))} · ${T('tooth')} ${Chart.lbl(fdi)} · ${fmtD(w.at)}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      ${sec('🦷', T('planSummary'), `
        <div class="row mt" style="gap:9px">
          <span class="pill ${full?'g':'w'}">${full?`✓ ${T('completed')}`:T('inProgress')}</span>
          <span class="pill n">${T('courseNo')} ${c}</span>
          ${plan?`<span class="pill n" style="color:${P(plan.proc).col}">
            ${esc(pName(plan.proc))}</span>`:''}
        </div>
        ${early?`<div class="tiny mt" style="color:var(--wr)">${T('sealedEarly')}</div>`:''}
        ${total?`
          <div class="row mt" style="justify-content:space-between">
            <span class="tiny">${done} ${T('ofN')} ${total} ${T('toothVisits')}</span>
            <span class="tiny mono">${full?100:pct}%</span>
          </div>
          <div class="track mt"><i style="width:${full?100:pct}%;
            background:${full?'var(--ok)':col}"></i></div>
          <div class="row wrapv mt" style="gap:6px">
            ${Array.from({length:total},(_,i)=>i+1).map(n=>{
              const on  = nums.has(n);
              const now = (w.sessionNos||[]).map(Number).includes(n);
              return `<span class="pill ${now?'b':on?'g':'n'}">
                ${on?'✓ ':''}${T('sessionN')} ${n}${now?' •':''}</span>`;}).join('')}
          </div>
          ${!full && total>done?`<div class="tiny mt" style="color:var(--ink3)">
            ${total-done} ${T('notDone')}</div>`:''}`:''}
        <div class="mt2">${Chart.svg(map, Number(fdi))}</div>
        ${Chart.legend()}`)}

      ${sec('🪥', T('sessionRx'), `
        <div class="mt">
          <div class="h3" style="color:${col}">${esc(pName(w.proc))}</div>
          <div class="tiny mt">${fmtD(w.at)} ${fmtT(w.at)}</div>
          ${w.note?`<div class="card flat mt" style="padding:11px">
            <div class="tiny" style="color:var(--ink3)">${T('workNote')}</div>
            <div style="font-weight:600;margin-top:3px">${esc(w.note)}</div>
          </div>`:''}
          ${w.by==='secretary'?`<span class="pill n" style="margin-top:7px">
            ${T('enteredBy')}: ${T('bySecretary')}</span>`:''}
        </div>`)}

      ${sec('🗂', T('sessionArc'),
        files.length?`<div class="g4 mt">${files.map(f=>`
          <div style="cursor:pointer" onclick="Doc.viewFile('${f.id}')">
            <img src="${f.data}" style="width:100%;aspect-ratio:1;object-fit:cover;
              border-radius:12px;border:1px solid var(--edge)">
            <div class="tiny ctr" style="margin-top:4px">${T(f.kind)}</div>
          </div>`).join('')}</div>`
        :`<div class="emp mt">${T('noSessionArc')}</div>`,
        files.length?`<span class="pill n">${files.length}</span>`:'')}

      ${sec('📋', T('sessionInfo'), `
        <div class="col mt">
          <div class="it" style="cursor:default;padding:10px 12px">
            <div class="gr"><div class="tiny">${T('name')}</div>
              <div style="font-weight:700">${esc(nm(p))}</div></div>
            <div style="text-align:end"><div class="tiny">${T('file')}</div>
              <div class="mono" style="font-weight:700">${esc(p.mrn||'—')}</div></div>
          </div>
          ${visit?`<div class="it" style="cursor:default;padding:10px 12px">
            <div class="gr"><div class="tiny">${T('visit')}</div>
              <div style="font-weight:700">${visit.no} · ${fmtD(visit.date)}</div></div>
            <div style="text-align:end"><div class="tiny">${T('barcode')}</div>
              <div class="mono tiny">${esc(visit.code||'—')}</div></div>
          </div>`:''}
        </div>`)}

      ${sec('₪', T('sessionAmt'), `
        <div class="g2 mt">
          <div class="card flat ctr" style="padding:13px 8px">
            <div class="tiny">${T('sessionAmt')}</div>
            <div class="mono h2 mt">${N(w.price)}</div></div>
          <div class="card flat ctr" style="padding:13px 8px">
            <div class="tiny">${T('paid')}</div>
            <div class="mono h2 mt" style="color:var(--ok)">${N(paid)}</div></div>
        </div>
        ${pays.length?`<div class="col mt">${pays.map(x=>`
          <div class="it" style="cursor:default;padding:9px 11px">
            <div class="av g" style="width:30px;height:30px;font-size:13px">₪</div>
            <div class="gr"><div class="mono" style="font-weight:700">${N(x.amt)}</div>
              <div class="tiny">${fmtD(x.at)} · ${T(x.method||'cash')}</div></div>
          </div>`).join('')}</div>`:''}`)}

      ${sec('✍️', T('whatDoctorWrote'),
        visit?.done?`<div class="card flat mt" style="padding:12px;font-weight:600;
          line-height:1.7">${esc(visit.done)}</div>`

        onclick="Nav.session('${visit.id}')">${T('openSession')}</button>`:''}
      <button class="btn w gh mt" onclick="Nav.back()">${T('back')}</button>`);
  },

          <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>

  wirePlan(){
    SG.attach($('#pl-note'), 'plannote');

    SG.attach($('#pl-text'), 'proctext');

  procChanged(){
    const sel = $('#pl-proc'); if (!sel) return;
    const custom = sel.value === '__x';
    $('#pl-custom')?.classList.toggle('hide', !custom);
    const pr = $('#pl-price');
    if (pr) pr.value = custom ? '' : (sel.selectedOptions[0]?.dataset.p || '');
    if (custom) setTimeout(()=>$('#pl-text')?.focus(), 80);

  /* أرقام الجلسات تُبنى حسب العدد المطلوب، ويمكن اختيار أكثر من واحدة */
  rebuildChips(){
    const box = $('#pl-chips'); if (!box) return;
    const n = Math.max(1, Math.min(20, Number($('#pl-n')?.value) || 1));
    const picked = new Set([...box.querySelectorAll('.on')].map(b=>Number(b.dataset.n)));
    box.innerHTML = Array.from({length:n},(_,i)=>i+1).map(k=>`
      <button type="button" class="btn sm ${picked.has(k)?'':'gh'} ${picked.has(k)?'on':''}"
        data-n="${k}" onclick="Doc.toggleChip(this)">${T('sessionN')} ${k}</button>`).join('');
    if (!picked.size){ const first = box.querySelector('button'); if (first) this.toggleChip(first); }
  },

  toggleChip(b){
    const on = b.classList.toggle('on');
    b.classList.toggle('gh', !on);
  },

  async savePlan(fdi){
    let proc = $('#pl-proc').value;
    if (proc === '__x'){
      const t = ($('#pl-text')?.value || '').trim();
      if (t.length < 2){ $('#pl-text')?.classList.add('err'); return toast(T('typeProc'),'e'); }
      proc = 'x:' + t;
      await SG.learn('proctext', t);
    }
    const count = Math.max(1, Number($('#pl-n').value) || 1);
    const price = Number($('#pl-price').value) || 0;
    const note  = ($('#pl-note').value || '').trim();
    const picked = [...document.querySelectorAll('#pl-chips .on')].map(b=>Number(b.dataset.n));

    await Ops.savePlan(S.patient.id, fdi, { proc, sessions:count, price, note });
    await SG.learn('plannote', note);

    /* الجلسات المختارة اليوم تُسجَّل كأعمال فوراً */
    if (picked.length && S.visit){
      const c = await Ops.course(S.patient.id, fdi);
      await DB.put('works', {
        id:uid(), vid:S.visit.id, pid:S.patient.id, proc, fdi,
        course:c, sessionNos:picked, by:S.role,
        price: price * picked.length, note, at:Date.now(),
      });
      const st = P(proc).st;
      if (st) await Ops.setTooth(S.patient.id, fdi, st, S.visit.id);
    }

    toast(T('planSaved'), 's');
    Nav.stack.pop();
    this.tooth(fdi);
  },

  /* فتح ملف السن من صفحة المراجع: المفتوح يفتح البطاقة الحية،
     والمختوم يفتح الملخص المؤرشف. */
  async openToothFile(pid, fdi, course){
    S.patient = await DB.get('patients', pid);
    const rec = await Ops.toothRec(pid, fdi);
    if (Number(course) === (rec.course || 1)){
      const vs = (await DB.by('visits','pid',pid)).sort((a,b)=>(b.at||0)-(a.at||0));
      S.visit = vs.find(v=>v.st==='open') || vs[0] || null;
      return this.tooth(Number(fdi));
    }
    return this.toothCourse(pid, Number(fdi), Number(course));
  },

      ${f.pays.length?`<div class="card">

          ${['xray','lab','jaw','photo'].map((k,i)=>`
            <button class="${i===0?'on':''}" data-v="${k}" onclick="Sec.pm(this)">${T(k)}</button>`).join('')}
        </div></div>
      <div class="mt2"><input type="file" id="fi" accept="image/*" capture="environment"></div>

        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn gr" style="flex:2" onclick="Doc.saveFile()">${T('save')}</button>

  async saveFile(){
    const f = $('#fi').files[0];
    if (!f) return toast(T('required'), 'e');
    const kind = $('#fk .on')?.dataset.v || 'photo';
    /* تصغير الصورة قبل الحفظ حتى لا تتضخم قاعدة البيانات */
    const data = await new Promise(res=>{
      const rd = new FileReader();
      rd.onload = () => {
        const img = new Image();
        img.onload = () => {
          const M = 1400, sc = Math.min(1, M/Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = img.width*sc; c.height = img.height*sc;
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', .82));
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(f);
    });
    await DB.put('files', { id:uid(), pid:S.patient.id, vid:S.visit?.id||null,
                            kind, data, at:Date.now() });
    toast(T('saved'),'s');
    Nav.back();

/*═══════════════ الحسابات والإحصائيات ═══════════════
  ثلاث شاشات فوق فلتر تاريخ واحد: الحسابات (المبالغ)، الإحصائيات
  (الأعمال)، المراجعون. كل رقم يظهر هو حصيلة الفلتر الظاهر فوقه —
  لا مجاميع خفية ولا فترة مضمرة.
═══════════════════════════════════════════════════*/
const Money = {
  view:'acc',
  /* الفلتر المشترك — التاريخ لكل الشاشات، والسن والعمل للإحصائيات */
  f:{ range:'today', from:today(), to:today(), fdi:'', proc:'' },

  set(v){ this.view = v; this.draw(); },

  /*──────── مدى التاريخ ────────*/
  span(){
    const now = new Date();
    const ago = n => { const x = new Date(now); x.setDate(x.getDate()-n); return dkey(x); };
    switch (this.f.range){
      case 'today': return { from:dkey(now), to:dkey(now) };
      case 'yest':  return { from:ago(1),    to:ago(1) };
      case 'week':  return { from:ago(6),    to:dkey(now) };
      case 'month': return { from:dkey(now).slice(0,8)+'01', to:dkey(now) };
      case 'all':   return { from:'', to:'' };
      default:      return { from:this.f.from||'', to:this.f.to||'' };
    }
  },

  spanLabel(){
    const s = this.span();
    if (!s.from && !s.to) return T('allTime');
    if (s.from && s.to && s.from === s.to) return fmtD(s.from);
    return `${s.from?fmtD(s.from):'…'} — ${s.to?fmtD(s.to):'…'}`;
  },

  inSpan(ts){
    const s = this.span(), k = dkey(ts);
    if (s.from && k < s.from) return false;
    if (s.to   && k > s.to)   return false;
    return true;
  },

  /*──────── شريط الفلتر ────────*/
  filterBar(){
    const s = this.span();
    const chip = (k,l) => `<button class="btn sm rchip ${this.f.range===k?'':'gh'}"
      data-k="${k}" onclick="Money.range('${k}')">${T(l)}</button>`;
    return `<details class="acc" ${this.f.range==='custom'?'open':''}>
      <summary>
        <span class="accic">📅</span>
        <span class="gr">${T('dateRange')}</span>
        <span class="pill b" id="f-span">${this.spanLabel()}</span>
        <span class="ar">${isAr()?'‹':'›'}</span>
      </summary>
      <div class="bd">
        <div class="row wrapv" style="gap:6px">
          ${chip('today','fToday')}${chip('yest','fYest')}${chip('week','fWeek')}
          ${chip('month','fMonth')}${chip('all','allTime')}${chip('custom','fCustom')}
        </div>
        <div class="g2 mt2">
          <div><label class="lb">${T('from')}</label>
            <input type="date" id="f-from" value="${esc(s.from)}" onchange="Money.custom()"></div>
          <div><label class="lb">${T('to')}</label>
            <input type="date" id="f-to" value="${esc(s.to)}" onchange="Money.custom()"></div>
        </div>
      </div></details>`;
  },

  /* الشرائح والحقول تُحدَّث في مكانها — لا يُعاد بناء الشريط
     حتى لا تنغلق القائمة ولا يقفز مؤشّر حقل التاريخ. */
  syncBar(){
    const s = this.span();
    const ff = $('#f-from'); if (ff) ff.value = s.from;
    const ft = $('#f-to');   if (ft) ft.value = s.to;
    const sp = $('#f-span'); if (sp) sp.textContent = this.spanLabel();
    $$('#acc-filter .rchip').forEach(b =>
      b.classList.toggle('gh', b.dataset.k !== this.f.range));
  },

  range(k){ this.f.range = k; const s = this.span();
    this.f.from = s.from; this.f.to = s.to; this.syncBar(); this.body(); },

  custom(){ this.f.range = 'custom';
    this.f.from = $('#f-from')?.value || '';
    this.f.to   = $('#f-to')?.value   || '';
    this.syncBar(); this.body(); },

  resetF(){ this.f.fdi = ''; this.f.proc = ''; this.stats(); },

  /*──────── العرض ────────*/
  async draw(){
    $('#view').innerHTML = `
      <div class="segs">
        ${[['acc','accMoney'],['stat','accStats'],['pts','accPatients']].map(([k,l])=>
          `<button class="${this.view===k?'on':''}"
             onclick="Money.set('${k}')">${T(l)}</button>`).join('')}
      </div>
      ${this.view!=='pts'?`<div id="acc-filter" class="mt2">${this.filterBar()}</div>`:''}
      <div id="acc-body" class="mt2">${UI.spin()}</div>`;
    return this.body();
  },

  body(){
    if (this.view === 'acc')  return this.accounts();
    if (this.view === 'stat') return this.stats();
    return this.patients();
  },

  card(label, val, color, sub){
    return `<div class="card ctr" style="padding:15px 8px">
      <div class="tiny" style="font-weight:700">${label}</div>
      <div class="mono h2" style="margin-top:5px;${color?`color:${color}`:''}">${val}</div>
      ${sub?`<div class="tiny" style="margin-top:2px">${sub}</div>`:''}</div>`;
  },

  /*──────── البيانات ضمن الفلتر ────────*/
  async data(){
    const works = (await DB.all('works')).filter(w => this.inSpan(w.at));
    const pays  = (await DB.all('payments')).filter(x => this.inSpan(x.at));
    return { works, pays,
      total: works.reduce((a,x)=>a+Number(x.price||0),0),

/*═══════════════ الصلاحيات والتوجيه ═══════════════*/
const Perm = {
  /* من يرى مخطط الأسنان؟ الطبيب دائماً، والسكرتير حسب إعداد الطبيب */
  chart(){ return S.role==='doctor' || (S.role==='secretary' && CFG.data.secChart); },
  /* تسجيل الأعمال وتحديد السن: من يملك المخطط يملكها —
     لأن اختيار السن ونوع العمل جزء من المخطط نفسه. */
  addWork(){ return this.chart(); },
  /* كتابة العلاج للطبيب وحده — حتى لو فُتح المخطط للسكرتير */
  writeRx(){ return S.role==='doctor'; },
  money(){ return S.role==='doctor' || S.role==='secretary'; },
};

const Nav = {
  /* فتح جلسة: الطبيب يرى الشاشة السريرية، السكرتير يرى شاشة الحساب */
  /* السكرتير يبقى دائماً في شاشته حتى لا يفقد أزراره،
     والمخطط يُفتح من زر داخلها عند السماح به. */
  session(vid){
    return S.role==='doctor' ? Doc.session(vid) : Sec.visit(vid);
  },

  /*──────────────────────────────────────────────
    سجل الصفحات: كل صفحة تُفتح تُسجَّل، و"رجوع"
    يعود خطوة واحدة فقط بدل القفز للواجهة الرئيسية.
    الصفحات تُغلَّف تلقائياً فلا حاجة لتعديل كل زر.
  ──────────────────────────────────────────────*/
  stack:[], raw:{}, busy:false,

  wrap(){
    for (const path of PAGES){
      const [o,f] = path.split('.');
      const obj = REG[o];
      if (!obj || typeof obj[f] !== 'function') continue;
      this.raw[path] = obj[f].bind(obj);
      obj[f] = (...a) => {
        if (!this.busy) this.push(path, a);
        return this.raw[path](...a);
      };
    }
  },

  /* مفتاح الصفحة = اسمها + مُعرّفاتها، فصفحتان لسنّين مختلفين ليستا واحدة */
  key(path, a){
    return path + '|' + a.map(x =>
      (x && typeof x === 'object') ? (x.id || '#') : String(x)).join(',');
  },

  /* إعادة فتح صفحة موجودة في السجل = رجوع إليها، لا تكديس نسخة ثانية منها.
     هذا يمنع الحاجة للضغط على «رجوع» مرتين بعد كل حفظ. */
  push(path, a){
    const k = this.key(path, a);
    const i = this.stack.findIndex(x => x.k === k);
    if (i >= 0) this.stack.length = i;
    this.stack.push({ path, a, k });
  },

  back(){
    this.stack.pop();
    const top = this.stack[this.stack.length-1];
    if (!top){ UI.close(); App.draw(); return; }
    this.busy = true;
    try { return this.raw[top.path](...top.a); }
    finally { this.busy = false; }
  },

  home(){ this.reset(); S.chartOpen = false; UI.close(); App.draw(); },
  reset(){ this.stack = []; },
};

      <button class="btn w gh mt2" onclick="Nav.back()">${T('cancel')}</button>`);
  },

  async visit(vid){
    if (!this.allowed()) return;
    if (!ask(T('removeTodayQ'))) return;
    await Ops.deleteVisit(vid);
    toast(T('removed'), 's');
    Nav.home();
  },

  async patient(pid){
    if (!this.allowed()) return;
    const p = await DB.get('patients', pid); if (!p) return;
    if (!ask(nm(p) + '\n\n' + T('delPtQ'))) return;
    if (!ask(T('delPtQ2'))) return;
    await Ops.deletePatient(pid);
    toast(T('ptDeleted'), 's');
    Nav.home();
  },
};

/*═══════════════ الوصفات ═══════════════*/
const Rx = {
  write(){ S.rxDraft = [{}]; this.sheet(); },

  sheet(){
    const rows = S.rxDraft.map((it,i)=>`
      <div class="card flat" style="margin-top:10px;padding:13px">
        <div class="row" style="justify-content:space-between;margin-bottom:9px">
          <span class="lbl">${i+1}</span>
          ${S.rxDraft.length>1?`<button class="btn xs gh" onclick="Rx.del(${i})">×</button>`:''}
        </div>
        <input id="rx-d${i}" placeholder="${T('drug')} *" value="${esc(it.drug||'')}"
          dir="ltr" style="text-align:left;font-weight:700">
        <div class="g3 mt">
          <input id="rx-o${i}" placeholder="${T('dose')}" value="${esc(it.dose||'')}" dir="ltr" style="text-align:left">
          <input id="rx-f${i}" placeholder="${T('freq')}" value="${esc(it.freq||'')}" dir="ltr" style="text-align:left">
          <input id="rx-u${i}" placeholder="${T('dur')}"  value="${esc(it.dur||'')}" dir="ltr" style="text-align:left">
        </div>
        <div class="mt"><input id="rx-i${i}" placeholder="${T('instr')}" value="${esc(it.instr||'')}"
          dir="ltr" style="text-align:left"></div>
      </div>`).join('');

    UI.sheet(`
      <div class="h1">${T('writeRx')}</div>
      <div class="sub">${esc(nm(S.patient||{}))}</div>
      ${MH.alerts(S.patient?.mh, true).length?`<div class="col mt">${
        MH.alerts(S.patient?.mh, true).map(x=>`<div class="al ${x.risk===2?'r':'w'}">
          <span>⚠</span><span>${esc(x.txt)}${x.d?` — <b>${esc(x.d)}</b>`:''}</span></div>`).join('')}</div>`:''}
      ${rows}
      <button class="btn w gh mt" onclick="Rx.add()">＋ ${T('addDrug')}</button>
      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn sf gr" onclick="Rx.save(false)">💾 ${T('saveOnly')}</button>
        <button class="btn gr" onclick="Rx.save(true)">🖨 ${T('savePrint')}</button>
      </div>`);

    S.rxDraft.forEach((_,i)=>{
      SG.attach($('#rx-d'+i),'drug'); SG.attach($('#rx-o'+i),'dose');
      SG.attach($('#rx-f'+i),'freq'); SG.attach($('#rx-u'+i),'dur');
      SG.attach($('#rx-i'+i),'instr');
    });
  },

  /* الطبيب يرى وصفاته المكتوبة وحالتها — الصرف ليس من هنا */
  async list(){
    const v = $('#view'); v.innerHTML = UI.spin();
    const rs = (await DB.all('rx')).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,80);
    const rows = [];
    for (const r of rs){
      const p = await DB.get('patients', r.pid); if (!p) continue;
      rows.push(`<div class="it" onclick="Rx.view('${r.id}')">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr">
          <div class="h3 ell">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.at)} · ${r.items.length} ${T('drug')}</div>
        </div>
        <span class="pill ${r.st==='done'?'g':'w'}">${r.st==='done'?T('dispensed'):T('pending')}</span>
      </div>`);
    }
    v.innerHTML = `<div class="lbl">${T('rxList')}</div>
      <div class="col mt2">${rows.join('')||`<div class="emp">${T('noRx')}</div>`}</div>`;
  },

  async view(id){
    const r = await DB.get('rx', id);
    const p = await DB.get('patients', r.pid);
    UI.sheet(`
      <div class="shhead">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr">
          <div class="h2">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.at)} · ${T('file')} ${esc(p.mrn)}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      <div class="lbl">${T('rxPaper')}</div>
      <div class="mt">${await Print.rxPreview(id)}</div>

      <div class="al ${r.st==='done'?'g':'i'} mt2"><span>${r.st==='done'?'✓':'ℹ'}</span>
        <span>${r.st==='done'?T('dispensed'):T('onlyPharmacy')}</span></div>

      <button class="btn w mt2" onclick="Print.rx('${r.id}')">🖨 ${T('printA5')}</button>
      <button class="btn w gh mt" onclick="Nav.back()">${T('close')}</button>`);
  },

  read(){ return S.rxDraft.map((_,i)=>({
    drug:($('#rx-d'+i)?.value||'').trim(), dose:($('#rx-o'+i)?.value||'').trim(),
    freq:($('#rx-f'+i)?.value||'').trim(), dur:($('#rx-u'+i)?.value||'').trim(),
    instr:($('#rx-i'+i)?.value||'').trim() })); },

  /* إعادة رسم الورقة ليست صفحة جديدة — تُستبدل مكانها */
  redraw(){ Nav.stack.pop(); this.sheet(); },
  add(){ S.rxDraft=this.read(); S.rxDraft.push({}); this.redraw(); },
  del(i){ S.rxDraft=this.read(); S.rxDraft.splice(i,1); this.redraw(); },

  async save(alsoPrint){
    const items = this.read().filter(x=>x.drug.length>=2);
    if (!items.length) return toast(T('fillAll'),'e');

    /* تحذير الحساسية قبل الحفظ */
    const alg = (S.patient?.mh?.allergy_drug?.d||'').toLowerCase();
    if (alg.length>2){
      const hit = items.filter(i=>i.drug.toLowerCase().includes(alg));
      if (hit.length && !ask(`⚠ ${T('allergy')}: ${alg}\n${hit.map(h=>h.drug).join(', ')}\n\n${T('confirm')}?`)) return;
    }

    let v = S.visit;
    if (!v) v = await Ops.openVisit(S.patient.id);
    const rx = { id:uid(), pid:S.patient.id, vid:v.id, items, st:'signed',
                 doctor: CFG.data.doctor || T('r_doctor'),
                 cid: CFG.data.cid, at:Date.now() };
    await DB.put('rx', rx);
    for (const i of items){
      await SG.learn('drug',i.drug); await SG.learn('dose',i.dose);
      await SG.learn('freq',i.freq); await SG.learn('dur',i.dur); await SG.learn('instr',i.instr);
    }
    toast(T('saved'),'s');
    /* العودة إلى جلسة الوصفة نفسها — لا إلى آخر صفحة في السجل،
       فقد تكون صفحة المرفقات إن فُتحت قبل كتابة العلاج. */
    Nav.reset(); UI.close();
    if (alsoPrint) Print.rx(rx.id);
    Nav.session(v.id);
  },
};

/*═══════════════ الطباعة ═══════════════*/
const Print = {
  /* الشعار المرفوع في الإعدادات هو رأس الورقة نفسه — يُطبع بعرض
     الصفحة كاملاً. النص يظهر فقط عند غياب الشعار. */
  head(){
    const c = CFG.data;
    if (c.logo){
      return `<div style="text-align:center;padding-bottom:6px">
        <img src="${c.logo}" style="width:100%;max-height:130px;object-fit:contain;display:block">
      </div>`;
    }
    return `<div style="text-align:center;border-bottom:3px solid #00695C;padding-bottom:8px">
      <div style="font-size:19px;font-weight:800">${esc(c.header||c.clinic)}</div>
      ${c.doctor?`<div style="font-size:13px">${esc(c.doctor)}${c.title?' — '+esc(c.title):''}</div>`:''}
    </div>`;
  },
  win(inner, title){
    const w = window.open('','_blank','width=600,height=820');
    w.document.write(`<!DOCTYPE html><html lang="${LG}" dir="${isAr()?'rtl':'ltr'}"><head>
      <meta charset="utf-8"><title>${esc(title)}</title>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
      <style>@page{size:A5;margin:9mm}
        body{font-family:'IBM Plex Sans Arabic',sans-serif;margin:0;color:#111;font-size:13px}
        table{width:100%;border-collapse:collapse;margin-top:8px}
        td,th{padding:7px 5px;border-bottom:1px solid #ccc;text-align:start}
        th{background:#eef3f3;font-size:11.5px}
        .ft{position:fixed;bottom:0;inset-inline:0;text-align:center;font-size:11px;
            color:#555;border-top:1px solid #ddd;padding-top:5px}
      </style></head><body>${inner}
      <div class="ft">${CFG.data.footerImg
        ? `<img src="${CFG.data.footerImg}" style="width:100%;max-height:70px;object-fit:contain">`
        : esc(CFG.data.footer||'')}</div>
      <script>window.onload=()=>setTimeout(()=>window.print(),420)<\/script>
      </body></html>`);
    w.document.close();
  },

  /* جسم ورقة A5 — مصدر واحد يُستخدم للطباعة وللمعاينة داخل البرنامج،
     فما يراه الصيدلي هو نفسه ما يطبعه الطبيب حرفياً. */
  /* كل جزء يُعزل باتجاهه: الرقم يبقى ملتصقاً بكلمته العربية
     ولا يقفز للحقل المجاور — سبب ظهور "٤" مع حقل المدة. */
  seg(v){ return `<bdi style="unicode-bidi:isolate">${esc(v)}</bdi>`; },

  rxBody(rx, p, forScreen){
    const c = CFG.data;
    const head = c.logo
      ? `<div class="phd"><img src="${c.logo}"></div>`
      : `<div class="phd">
           <div style="font-size:19px;font-weight:800">${esc(c.header||c.clinic)}</div>
           ${c.doctor?`<div style="font-size:13px">${esc(c.doctor)}${c.title?' — '+esc(c.title):''}</div>`:''}
         </div>`;

    const items = rx.items.map((i,n)=>`
      <div class="rxrow">
        <div class="n">${n+1}</div>
        <div class="rxtxt">
          <div class="dname">${esc(i.drug)}</div>
          <div class="ddose">${[i.dose,i.freq,i.dur,i.instr]
            .filter(Boolean).map(x=>this.seg(x)).join(' — ')}</div>
        </div>
      </div>`).join('');

    return `${head}
      <div class="pmeta">
        <span><b>${esc(nm(p))}</b></span>
        <span>${p.age||''} ${T('yrs')}</span>
        <span>${esc(p.mrn||'')}</span>
        <span>${fmtD(rx.at)}</span>
      </div>
      <div style="font-size:16px;font-weight:800;margin:8px 0 2px;color:#00695C">℞</div>
      ${items}
      ${rx.notes?`<div style="margin-top:10px;font-size:12px">${esc(rx.notes)}</div>`:''}
      <div class="psig">
        ${c.sign?`<img src="${c.sign}" alt="">`:''}
        <div class="pname">${esc(c.doctor||'')}</div>
        ${c.title?`<div style="font-size:11px;color:#555">${esc(c.title)}</div>`:''}
      </div>
      ${forScreen && c.footer?`<div class="pft">${esc(c.footer)}</div>`:''}`;
  },

  /* معاينة داخل البرنامج */
  async rxPreview(id){
    const rx = await DB.get('rx', id);
    const p  = await DB.get('patients', rx.pid);
    return `<div class="paper">${this.rxBody(rx, p, true)}</div>`;
  },

  async rx(id){
    const rx = await DB.get('rx', id);
    const p  = await DB.get('patients', rx.pid);
    this.win(`${this.head()}
      <div style="display:flex;justify-content:space-between;font-size:12.5px;
        margin:11px 0;padding:8px 0;border-bottom:1px dashed #999">
        <span><b>${esc(nm(p))}</b></span><span>${p.age||''} ${T('yrs')}</span>
        <span>${esc(p.mrn)}</span><span>${fmtD(rx.at)}</span></div>
      <div style="font-size:16px;font-weight:800;margin-top:6px;color:#00695C">℞</div>
      <table dir="ltr"><tbody>${rx.items.map((i,n)=>`<tr>
        <td style="width:24px;font-weight:800;color:#00695C;text-align:left">${n+1}</td>
        <td style="text-align:left">
          <b style="font-size:14.5px">${esc(i.drug)}</b>
          <div style="font-size:11.5px;color:#444;margin-top:2px;unicode-bidi:plaintext">
          ${[i.dose,i.freq,i.dur,i.instr].filter(Boolean)
            .map(x=>`<bdi style="unicode-bidi:isolate">${esc(x)}</bdi>`).join(' — ')}</div></td>
      </tr>`).join('')}</tbody></table>
      ${rx.notes?`<div style="margin-top:10px;font-size:12px">${esc(rx.notes)}</div>`:''}
      <div style="margin-top:26px;text-align:center;font-size:12px">
        ${CFG.data.sign?`<img src="${CFG.data.sign}" style="display:block;margin:0 auto -6px;
          max-height:64px;max-width:210px;object-fit:contain">`:''}
        <div style="font-weight:800;font-size:13px;border-top:1px solid #444;
          display:inline-block;padding-top:5px;min-width:190px">${esc(CFG.data.doctor||'')}</div>
        ${CFG.data.title?`<div style="font-size:11px;color:#555">${esc(CFG.data.title)}</div>`:''}
      </div>`, nm(p));
  },

  async barcode(vid){
    const v = await DB.get('visits', vid);
    const p = await DB.get('patients', v.pid);
    this.win(`<div style="text-align:center;padding:6px">
      ${CFG.data.logo?`<img src="${CFG.data.logo}" style="width:100%;max-height:70px;object-fit:contain">`
        :`<div style="font-size:15px;font-weight:800">${esc(CFG.data.clinic)}</div>`}
      <div style="font-size:14px;font-weight:700;margin-top:5px">${esc(nm(p))}</div>
      <div style="font-size:11.5px;color:#444">${esc(p.mrn)} · ${p.age||''} ${T('yrs')} · ${fmtD(v.date)}</div>
      <div style="margin-top:9px">${C39.svg(v.code, 62)}</div>
      <div style="font-family:monospace;letter-spacing:.16em;font-size:13px;font-weight:700">${esc(v.code)}</div>
    </div>`, v.code);
  },

  async day(){
    const works = (await DB.all('works')).filter(w=>dkey(w.at)===today());
    const rows = [];
    for (const w of works){ const p = await DB.get('patients', w.pid);
      rows.push(`<tr><td>${esc(p?nm(p):'—')}</td>
        <td style="font-family:monospace">${w.fdi?Chart.lbl(w.fdi):'—'}</td>
        <td>${esc(pName(w.proc))}</td><td style="font-family:monospace">${N(w.price)}</td>
        <td style="font-size:11px">${esc(w.note||'')}</td></tr>`); }
    const tot = works.reduce((s,x)=>s+Number(x.price||0),0);
    this.win(`${this.head()}
      <div style="font-size:15px;font-weight:800;margin-top:10px">${T('dayReport')} — ${fmtD(today())}</div>
      <table><thead><tr><th>${T('name')}</th><th>${T('workSite')}</th><th>${T('workType')}</th>
        <th>${T('amountPaid')}</th><th>${T('notes')}</th></tr></thead>
        <tbody>${rows.join('')||''}</tbody></table>
      <div style="margin-top:12px;font-weight:800;font-size:15px">${T('total')}: ${N(tot)}</div>`,
      T('dayReport'));
  },
};

/*═══════════════ الصيدلية ═══════════════*/
const Ph = {
  async queue(){
    const v = $('#view'); v.innerHTML = UI.spin();
    const rs = (await DB.all('rx')).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,60);
    const rows = [];
    for (const r of rs){
      const p = await DB.get('patients', r.pid); if(!p) continue;
      rows.push(`<div class="it" onclick="Ph.open('${r.id}')">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr"><div class="h3 ell">${esc(nm(p))}</div>
          <div class="tiny mono">${fmtD(r.at)} · ${r.items.length} ${T('drug')}</div></div>
        <span class="pill ${r.st==='done'?'g':'w'}">${r.st==='done'?T('dispensed'):T('pending')}</span>
      </div>`);
    }
    v.innerHTML = rows.length?`<div class="col">${rows.join('')}</div>`:`<div class="emp">${T('noRx')}</div>`;
  },

  /* الصيدلي يرى ورقة العلاج كما يطبعها الطبيب تماماً،
     مع الحساسيات — بلا تشخيص ولا أسعار. */
  async open(id){
    const r = await DB.get('rx', id);
    const p = await DB.get('patients', r.pid);
    const alerts = MH.alerts(p.mh, true);

    UI.sheet(`
      <div class="shhead">
        <div class="av ${r.st==='done'?'g':'w'}">℞</div>
        <div class="gr">
          <div class="h2">${esc(nm(p))}</div>
          <div class="tiny mono">${p.age||'—'} ${T('yrs')} · ${T('file')} ${esc(p.mrn)} · ${fmtD(r.at)}</div>
        </div>
        <button class="ib" onclick="Nav.back()">✕</button>
      </div>

      ${alerts.length?`<div class="col" style="margin-bottom:12px">${alerts.map(x=>`
        <div class="al ${x.risk===2?'r':'w'}"><span>${x.risk===2?'⚠':'!'}</span>
        <span>${esc(x.txt)}${x.d?` — <b>${esc(x.d)}</b>`:''}</span></div>`).join('')}</div>`
       :`<div class="al g" style="margin-bottom:12px"><span>✓</span><span>${T('noAlerts')}</span></div>`}

      <div class="lbl">${T('rxPaper')}</div>
      <div class="mt">${await Print.rxPreview(id)}</div>

      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Print.rx('${id}')">🖨 ${T('printA5')}</button>
        ${r.st==='done'
          ? `<div class="al g gr" style="flex:2;justify-content:center"><span>✓</span>
             <span>${T('dispensed')}</span></div>`
          : S.role==='pharmacy'
            ? `<button class="btn ok gr" style="flex:2" onclick="Ph.give('${id}')">${T('dispense')}</button>`
            : `<div class="al i gr" style="flex:2"><span>ℹ</span><span>${T('onlyPharmacy')}</span></div>`}
      </div>
      <button class="btn w gh mt" onclick="Nav.back()">${T('close')}</button>`);
  },

  /*──── الصرف مع مبلغ اختياري ────*/
  give(id){
    if (S.role !== 'pharmacy') return toast(T('onlyPharmacy'), 'e');
    UI.sheet(`
      <div class="shhead"><div class="gr">
        <div class="h2">${T('confirmDispense')}</div>
        <div class="sub">${T('rxAmountOpt')}</div>
      </div><button class="ib" onclick="Nav.back()">✕</button></div>
      <div class="card">
        <label class="lb">${T('rxAmount')}</label>
        <input id="rx-amt" class="mono" inputmode="numeric" dir="ltr"
          style="font-size:24px;text-align:center" placeholder="0">
      </div>
      <div class="row mt2" style="gap:9px">
        <button class="btn gh gr" onclick="Nav.back()">${T('cancel')}</button>
        <button class="btn ok gr" style="flex:2" onclick="Ph.confirmGive('${id}')">
          ${T('dispense')}</button>
      </div>`);
    setTimeout(()=>$('#rx-amt')?.focus(), 140);
  },

  async confirmGive(id){
    const r = await DB.get('rx', id);
    r.st = 'done'; r.doneAt = Date.now();
    r.amount = Number($('#rx-amt')?.value) || 0;   /* صفر = بلا مبلغ */
    r.doneBy = S.user?.id || 'pharmacy';
    await DB.put('rx', r);
    toast(T('dispensed'), 's');
    Nav.reset(); UI.close(); App.draw();
  },

  /*──── الأطباء المحوّلون لهذه الصيدلية ────*/
  async docs(){
    const v = $('#view'); v.innerHTML = UI.spin();
    const rs = await DB.all('rx');
    const map = {};
    for (const r of rs){
      const d = r.doctor || CFG.data.doctor || T('r_doctor');
      (map[d] ||= { name:d, total:0, done:0, amount:0, pts:new Set() });
      map[d].total++; map[d].pts.add(r.pid);
      if (r.st==='done'){ map[d].done++; map[d].amount += Number(r.amount||0); }
    }
    const docs = Object.values(map).sort((a,b)=> b.total - a.total);

    v.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <div class="lbl">${T('t_docs')}</div><span class="pill b">${docs.length}</span>
      </div>
      <div class="col mt2">${docs.length ? docs.map(d=>`
        <div class="it" onclick="Ph.docPatients('${encodeURIComponent(d.name)}')">
          <div class="av">${esc(d.name.replace(/^[دdD]\.?\s*/,'').charAt(0))}</div>
          <div class="gr">
            <div class="h3 ell">${esc(d.name)}</div>
            <div class="tiny mono">${d.pts.size} ${T('patients')} ·
              ${d.total} ${T('rxCount')} · ${d.done} ${T('dispensed')}</div>
          </div>
          <div style="text-align:end">
            <div class="tiny">${T('rxIncome')}</div>
            <div class="mono h3" style="color:var(--ok)">${N(d.amount)}</div>
          </div>
        </div>`).join('') : `<div class="emp">${T('noDocs')}</div>`}</div>`;
  },

  /* مراجعو طبيب معيّن مع حالة الصرف */
  async docPatients(encName){
    const name = decodeURIComponent(encName);
    const rs = (await DB.all('rx'))
      .filter(r => (r.doctor || CFG.data.doctor || T('r_doctor')) === name)
      .sort((a,b)=>(b.at||0)-(a.at||0));

/*═══════════════ مسح الباركود ═══════════════
  طريقتان: قارئ باركود يدوي (يكتب الرمز ثم Enter)، أو الكاميرا.
  الكاميرا تستخدم BarcodeDetector المدمج في المتصفح — بلا مكتبات
  خارجية، فيبقى البرنامج ملفاً واحداً يعمل بلا إنترنت.
═══════════════════════════════════════════════*/
const Scan = {
  stream:null, timer:null, det:null, facing:'environment',

  open(){
    UI.sheet(`
      <div class="shhead"><div class="gr">
        <div class="h2">${T('scan')}</div>
        <div class="sub">${T('scanHint')}</div>
      </div><button class="ib" onclick="Scan.close()">✕</button></div>

      <button class="btn w" onclick="Scan.camera()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"
            stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="1.9"/>
        </svg>${T('useCamera')}</button>

      <div id="cam-slot" class="mt"></div>

      <div class="card mt">
        <div class="lbl">${T('useReader')}</div>
        <div class="tiny" style="margin-top:4px">${T('typeCode')}</div>
        <input id="sc-in" class="mono mt" dir="ltr" autocomplete="off"
          style="font-size:19px;text-align:center;letter-spacing:.1em">
        <button class="btn w mt" onclick="Scan.go()">${T('confirm')}</button>
      </div>`);

    const i = $('#sc-in');
    setTimeout(()=>i?.focus(), 140);
    /* قارئ الباركود اليدوي يُرسل Enter بعد الرمز */
    i.onkeydown = e => { if (e.key === 'Enter') Scan.go(); };
  },

  close(){ this.stop(); Nav.back(); },

  /*──── الكاميرا ────*/
  async camera(){
    const slot = $('#cam-slot'); if (!slot) return;

    if (!('BarcodeDetector' in window)) return this.camErr(T('camUnsupported'));
    if (!navigator.mediaDevices?.getUserMedia) return this.camErr(T('camNeedHttps'));

    try {
      const formats = await BarcodeDetector.getSupportedFormats();
      const want = ['code_39','code_128','qr_code','ean_13','codabar','itf']
        .filter(f => formats.includes(f));
      this.det = new BarcodeDetector({ formats: want.length ? want : formats });
    } catch { return this.camErr(T('camUnsupported')); }

    slot.innerHTML = `
      <div class="camwrap">
        <video id="cam-v" playsinline muted autoplay></video>
        <div class="camaim"><div class="box"></div><div class="ln"></div></div>
        <div class="camst" id="cam-st">${T('pointCamera')}</div>
      </div>
      <div class="row mt" style="gap:8px">
        <button class="btn gh gr" onclick="Scan.stop()">${T('stopCam')}</button>
        <button class="btn gh gr" onclick="Scan.flip()">⟲ ${T('switchCam')}</button>
      </div>`;

    await this.start();
  },

  async start(){
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:{ ideal:this.facing }, width:{ideal:1280}, height:{ideal:720} },
        audio: false,
      });
    } catch (e) {
      const msg = e.name === 'NotAllowedError' ? T('camDenied')
                : e.name === 'NotFoundError'  ? T('camNone')
                : T('camNeedHttps');
      return this.camErr(msg);
    }

    const v = $('#cam-v'); if (!v) return this.stop();
    v.srcObject = this.stream;
    try { await v.play(); } catch {}
    this.loop();
  },

  loop(){
    const v = $('#cam-v');
    if (!v || !this.stream) return;
    const st = $('#cam-st'); if (st) st.textContent = T('scanning');

    const tick = async () => {
      if (!this.stream || !$('#cam-v')) return;
      try {
        const codes = await this.det.detect(v);
        const vals = codes.map(c => String(c.rawValue||'').trim().toUpperCase());
        /* نفضّل رمز زيارة صالحاً إن وُجد بين عدة رموز في الإطار */
        const hit = vals.find(x => /^V[0-9A-Z]{8,}$/.test(x)) || vals[0];
        if (hit){
          if (navigator.vibrate) navigator.vibrate(60);
          if (st) st.textContent = T('codeFound') + ' — ' + hit;
          this.stop(true);
          const inp = $('#sc-in'); if (inp) inp.value = hit;
          return this.go(hit);
        }
      } catch { /* إطار غير قابل للقراءة — نتابع */ }
      this.timer = setTimeout(tick, 220);
    };
    tick();
  },

  flip(){
    this.facing = this.facing === 'environment' ? 'user' : 'environment';
    this.stop(true);
    this.start();
  },

  stop(keepMsg){
    clearTimeout(this.timer); this.timer = null;
    if (this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream = null; }
    const v = $('#cam-v'); if (v) v.srcObject = null;
    if (!keepMsg){ const st = $('#cam-st'); if (st) st.textContent = T('stopCam'); }
  },

  camErr(msg){
    const slot = $('#cam-slot');
    if (slot) slot.innerHTML = `<div class="al w"><span>!</span><span>${esc(msg)}</span></div>`;
  },

  /*──── معالجة الرمز ────*/
  async go(code){
    const raw = (code || $('#sc-in')?.value || '').trim().toUpperCase();
    if (!raw) return;
    const v = await Ops.findByCode(raw);
    if (!v){
      toast(T('noResult'), 'e');
      const st = $('#cam-st'); if (st) st.textContent = T('noResult');
      if (this.det && !this.timer && this.stream) this.loop();
      return;
    }
    this.stop(true);
    UI.close();

    /* الصيدلي: الوصفة مباشرة */
    if (S.role === 'pharmacy'){
      const rs = await DB.by('rx','vid',v.id);
      if (!rs.length) return toast(T('noRx'), 'e');
      return Ph.open(rs[rs.length-1].id);
    }

    /* الطبيب والسكرتير: المسح = بحث عن اسمه في قائمة اليوم،
       فيظهر ضمن الدور بدل فتح ملفه أو جلسته مباشرة. */
    const p = await DB.get('patients', v.pid);
    if (!p) return toast(T('noResult'), 'e');

    Nav.reset();
    Sec.qq = p.mrn || nm(p);
    S.patient = null;
    S.tab = 'today';
    App.draw();

    const isToday = v.date === today();
    toast(isToday ? `${nm(p)} — ${T('bookedToday')}` : T('notBookedToday'),
          isToday ? 's' : 'e');
  },
};

const Appt = {
  /* بعد إنهاء الجلسة: هل يحتاج المراجع جلسة أخرى؟ */
  async ask(pid, vid){
    /* أسنان عُمل عليها في هذه الجلسة — يمكن إنهاء سلسلة أيٍّ منها هنا */
    const works = vid ? await DB.by('works','vid',vid) : [];

    for (const f of teeth){

        <div class="gr">
          <div class="tiny">${T('courseTotal')}</div>

            <span class="tiny" style="color:var(--ink3)">/ ${N(cs.total)}</span></div>
        </div>
        <button class="btn xs wn" onclick="Appt.endTooth('${pid}',${f},'${vid}')">

        <div class="lbl">${T('teethThisSession')}</div>
        <div class="col mt">${cards.join('')}</div>
      </div>`:''}

      ${S.role!=='secretary'
        ? `<button class="btn w sf mt" onclick="Appt.defer('${pid}','${vid}')">🗂 ${T('bySec')}</button>`
        : ''}
      ${teeth.length
        ? `<button class="btn w wn mt" onclick="Appt.sealAll('${pid}','${vid}')">
             ✔ ${T('sealNow')}</button>`
        : `<button class="btn w gh mt" onclick="Nav.home()">${T('no')}</button>`}`);
  },

  /* لا موعد قادم: تُختم ملفات كل أسنان هذه الجلسة وتظهر مكتملة */
  async sealAll(pid, vid){
    if (!ask(T('endCourseQ'))) return;
    const works = vid ? await DB.by('works','vid',vid) : [];
    const teeth = [...new Set(works.map(w=>Number(w.fdi)).filter(Boolean))];
    for (const f of teeth) await Ops.endCourse(pid, f);
    toast(T('sealedAll'), 's');
    Nav.home();
  },

  /* إنهاء سلسلة سن من شاشة الإنهاء */
  async endTooth(pid, fdi, vid){
    if (!ask(T('endCourseQ'))) return;
    await Ops.endCourse(pid, fdi);
    toast(T('courseDone'), 's');
    this.ask(pid, vid);
  },

  /* الطبيب يحيل تحديد الموعد للاستقبال — تظهر عندهم علامة انتظار */
  async defer(pid, vid){
    const v = await DB.get('visits', vid);
    v.needAppt = true; await DB.put('visits', v);
    toast(T('deferred'), 's'); Nav.home();
  },

  /* تحديد اليوم والتاريخ الكامل */

      <div class="shhead"><div class="gr">

        <div class="sub">${p ? T('apptFor')+' '+esc(nm(p)) : T('sendAppt')}</div>

    const day = d.toLocaleDateString(isAr()?'ar-IQ':'en-GB', { weekday:'long' });

  /*──── تحرير أنواع الأعمال ────*/
  async pcSave(){ CFG.data.procs = PROCS; await CFG.save(); },

  async pcName(i, lang, v){
    const t = String(v||'').trim(); if (!t) return;
    PROCS[i][lang] = t; await this.pcSave(); toast(T('saved'),'s');
  },
  async pcColor(i, col){ PROCS[i].col = col; await this.pcSave(); this.draw(); },
  async pcPrice(i, v){ PROCS[i].p = Number(v)||0; await this.pcSave(); toast(T('saved'),'s'); },
  async pcStatus(i, v){ PROCS[i].st = v || ''; await this.pcSave(); toast(T('saved'),'s'); },

  async pcAdd(){
    const name = prompt(T('procName')); if (!name) return;
    /* رمز ثابت لا يتغيّر مع إعادة التسمية، فلا تفقد السجلات معناها */
    PROCS.push({ c:'p_'+uid().slice(-6), ar:name.trim(), en:name.trim(),
                 cat:'gen', col:'#0E9BB5', st:'', p:0 });
    await this.pcSave(); this.draw();
  },

  async pcDel(i){
    const code = PROCS[i].c;
    const used = (await DB.all('works')).some(w => w.proc === code);
    if (!ask(used ? `${T('inUse')} — ${T('areYouSure')}` : T('areYouSure'))) return;
    PROCS.splice(i,1); await this.pcSave(); this.draw();
  },

  async pcReset(){
    if (!ask()) return;
    PROCS = JSON.parse(JSON.stringify(PROCS_DEF));
    delete CFG.data.procs; await CFG.save(); this.draw();
  },

  /*──── تحرير حالات الأسنان ────*/
  async stSave(){ CFG.data.tstat = TSTAT; await CFG.save(); },

  async stName(k, lang, val){
    const v = String(val||'').trim(); if (!v) return;
    TSTAT[k][lang] = v; await this.stSave(); toast(T('saved'),'s');
  },

  async stColor(k, col){
    TSTAT[k].col = col; await this.stSave(); this.draw();
  },

  async stAdd(){
    const name = prompt(T('statusName')); if (!name) return;
    /* مفتاح ثابت لا يتغيّر مع إعادة التسمية، فلا تفقد السجلات معناها */
    const key = 'st_' + uid().slice(-6);
    TSTAT[key] = { ar:name.trim(), en:name.trim(), col:'#0E9BB5' };
    await this.stSave(); this.draw();
  },

  async stDel(k){
    /* حالة مستخدمة في أعمال محفوظة لا تُحذف بصمت */
    const used = (await DB.all('tooth')).some(t => t.st === k);
    const msg = used ? `${T('inUse')} — ${T('areYouSure')}` : T('areYouSure');
    if (!ask(msg)) return;
    delete TSTAT[k]; await this.stSave(); this.draw();
  },

  async stReset(){
    if (!ask()) return;
    TSTAT = JSON.parse(JSON.stringify(TSTAT_DEF));
    delete CFG.data.tstat; await CFG.save(); this.draw();
  },

  async rmSign(){ if (!ask()) return; delete CFG.data.sign; await CFG.save(); this.draw(); },

  async toggleSecChart(){
    CFG.data.secChart = !CFG.data.secChart;
    await CFG.save();
    toast(CFG.data.secChart ? T('secChartOn') : T('secChartOff'), 's');
    this.draw();
  },

  async save(){
    const v = id => ($('#'+id)?.value ?? null);
    const map = { clinic:'s-clinic', doctor:'s-doc', title:'s-title',
                  header:'s-head', footer:'s-foot', phone:'s-phone',
                  country:'s-country', gov:'s-gov', area:'s-area', landmark:'s-landmark' };
    for (const [k,id] of Object.entries(map)){
      const x = v(id); if (x !== null) CFG.data[k] = x.trim();
    }
    await CFG.save();
    await CFG.register();   /* الدليل يعكس التعديل فوراً */
    toast(T('saved'),'s'); App.draw();
  },

  async export(){
    const out = {};
    for (const st of DB.STORES) out[st] = await DB.all(st);
    const blob = new Blob([JSON.stringify(out)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `dentalos-${today()}.json`; a.click();
  },

  async import(inp){
    const f = inp.files[0]; if(!f) return;
    if (!ask()) return;
    const data = JSON.parse(await f.text());
    for (const st of DB.STORES) for (const row of (data[st]||[])) await DB.put(st, row);
    await CFG.load(); toast(T('saved'),'s'); location.reload();
  },
};
